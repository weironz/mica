<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Roboto", "Noto Sans SC", -apple-system, "Segoe UI", "PingFang SC", sans-serif; color:#24292F; }
  .mem-row:hover { background:#F8FAFC; }
  select { font-family: inherit; }
</style>
</helmet>

<div style="width:1440px;height:900px;position:relative;background:#F8FAFC;overflow:hidden;border:1px solid #E5E9F0;">

  <div style="position:absolute;inset:0;display:flex;">
    <div style="width:280px;background:#FFFFFF;border-right:1px solid #EEF1F5;"></div>
    <div style="flex:1;background:#fff;"><div style="height:52px;border-bottom:1px solid #F1F5F9;"></div></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(15,23,42,0.34);"></div>

  <!-- Modal -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;background:#fff;border-radius:16px;box-shadow:0 24px 60px -12px rgba(15,23,42,0.4);overflow:hidden;">

    <div style="display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid #F1F5F9;">
      <span style="width:32px;height:32px;flex:none;border-radius:8px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:16px;">📗</span>
      <div style="flex:1;">
        <div style="font-size:17px;font-weight:700;letter-spacing:-0.3px;">工作区设置</div>
        <div style="font-size:12.5px;color:#9AA4AF;">管理名称、成员与访问权限</div>
      </div>
      <span style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9AA4AF;cursor:pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </span>
    </div>

    <div style="padding:24px;">

      <!-- Rename -->
      <label style="display:block;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:#9AA4AF;margin-bottom:8px;">工作区名称</label>
      <input value="我的工作区" style="width:100%;height:44px;padding:0 14px;border:1px solid #E2E8F0;border-radius:10px;font-size:15px;color:#24292F;outline:none;font-family:inherit;margin-bottom:24px;"/>

      <!-- Invite -->
      <label style="display:block;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:#9AA4AF;margin-bottom:8px;">邀请成员</label>
      <div style="display:flex;gap:8px;margin-bottom:24px;">
        <input placeholder="输入邮箱地址…" style="flex:1;height:44px;padding:0 14px;border:1px solid #E2E8F0;border-radius:10px;font-size:14px;color:#24292F;outline:none;font-family:inherit;"/>
        <select style="width:130px;height:44px;padding:0 10px;border:1px solid #E2E8F0;border-radius:10px;font-size:14px;color:#334155;outline:none;background:#fff;">
          <option>editor</option>
          <option>commenter</option>
          <option>viewer</option>
        </select>
        <button style="height:44px;padding:0 18px;border:none;background:#2563EB;color:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">邀请</button>
      </div>

      <!-- Members -->
      <label style="display:block;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:#9AA4AF;margin-bottom:8px;">成员 · {{ memberCount }}</label>
      <div style="border:1px solid #EEF1F5;border-radius:12px;overflow:hidden;">
        <sc-for list="{{ members }}" as="m" hint-placeholder-count="3">
          <div class="mem-row" style="{{ m.rowStyle }}">
            <span style="width:36px;height:36px;flex:none;border-radius:50%;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;background:{{ m.color }};">{{ m.initial }}</span>
            <div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:500;">{{ m.name }}</div><div style="font-size:12px;color:#9AA4AF;">{{ m.email }}</div></div>
            <sc-if value="{{ m.isOwner }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:12.5px;font-weight:600;color:#2563EB;background:#EFF6FF;padding:6px 12px;border-radius:8px;">owner</span>
            </sc-if>
            <sc-if value="{{ m.canManage }}" hint-placeholder-val="{{ true }}">
              <select style="width:130px;height:36px;padding:0 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:13px;color:#334155;outline:none;background:#fff;">
                <option selected="{{ m.isEditor }}">editor</option>
                <option selected="{{ m.isCommenter }}">commenter</option>
                <option selected="{{ m.isViewer }}">viewer</option>
              </select>
              <span title="移除" style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#DC2626;cursor:pointer;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </span>
            </sc-if>
          </div>
        </sc-for>
      </div>

    </div>

    <div style="display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #F1F5F9;background:#FBFCFE;">
      <button style="height:40px;padding:0 18px;border:1px solid #E2E8F0;background:#fff;border-radius:9px;font-size:14px;font-weight:500;color:#334155;cursor:pointer;font-family:inherit;">关闭</button>
      <button style="height:40px;padding:0 20px;border:none;background:#2563EB;color:#fff;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">保存</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { name:'林深 (你)', email:'lin@mica.dev', initial:'林', color:'#2563EB', role:'owner' },
      { name:'周舟', email:'zhou@mica.dev', initial:'周', color:'#16A34A', role:'editor' },
      { name:'Alex Chen', email:'alex@mica.dev', initial:'A', color:'#DB2777', role:'commenter' },
    ];
    const members = raw.map((m, i) => ({
      ...m,
      isOwner: m.role === 'owner',
      canManage: m.role !== 'owner',
      isEditor: m.role === 'editor',
      isCommenter: m.role === 'commenter',
      isViewer: m.role === 'viewer',
      rowStyle: `display:flex;align-items:center;gap:12px;padding:12px 14px;${i>0?'border-top:1px solid #F1F5F9;':''}`,
    }));
    return { members, memberCount: raw.length };
  }
}
</script>
</body>
</html>
