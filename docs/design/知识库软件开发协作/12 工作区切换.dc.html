<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Roboto", "Noto Sans SC", -apple-system, "Segoe UI", "PingFang SC", sans-serif; color:#24292F; }
  .ws-row:hover { background:#F1F5F9; }
  .ws-row:hover .ws-actions { opacity:1 !important; }
  .ws-actions span:hover { background:#E2E8F0; }
  .menu-row:hover { background:#F1F5F9; }
</style>
</helmet>

<div style="width:1440px;height:900px;position:relative;background:#F8FAFC;overflow:hidden;border:1px solid #E5E9F0;">

  <!-- Shell backdrop -->
  <div style="position:absolute;inset:0;display:flex;">
    <div style="width:280px;background:#FFFFFF;border-right:1px solid #EEF1F5;padding:16px;">
      <div style="height:52px;"></div>
    </div>
    <div style="flex:1;background:#fff;"><div style="height:52px;border-bottom:1px solid #F1F5F9;"></div></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(15,23,42,0.28);"></div>

  <!-- Switcher trigger (echo) + popover -->
  <div style="position:absolute;top:16px;left:16px;width:340px;">
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;background:#fff;box-shadow:0 0 0 2px #2563EB;">
      <span style="width:30px;height:30px;flex:none;border-radius:8px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:16px;">📗</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:600;">我的工作区</div>
        <div style="font-size:11.5px;color:#9AA4AF;">248 个页面 · 已同步</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA4AF" stroke-width="2" style="transform:rotate(180deg);"><polyline points="6 9 12 5 18 9"/><polyline points="6 15 12 19 18 15"/></svg>
    </div>

    <!-- Popover -->
    <div style="margin-top:8px;background:#fff;border:1px solid #E5E9F0;border-radius:13px;box-shadow:0 20px 50px -12px rgba(15,23,42,0.34);overflow:hidden;">

      <!-- Account row -->
      <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #F1F5F9;">
        <span style="width:32px;height:32px;flex:none;border-radius:50%;background:#E2E8F0;color:#334155;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">林</span>
        <div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:600;">林深</div><div style="font-size:11.5px;color:#9AA4AF;">lin@mica.dev</div></div>
      </div>

      <div style="max-height:440px;overflow-y:auto;padding:6px;">
        <!-- Cloud group -->
        <div style="display:flex;align-items:center;gap:6px;padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:#9AA4AF;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9AA4AF" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>云端
        </div>
        <sc-for list="{{ cloud }}" as="w" hint-placeholder-count="2">
          <div class="ws-row" style="{{ w.rowStyle }}">
            <span style="width:16px;flex:none;display:flex;justify-content:center;">{{ w.tick }}</span>
            <span style="width:28px;height:28px;flex:none;border-radius:7px;background:{{ w.iconBg }};display:flex;align-items:center;justify-content:center;font-size:14px;">{{ w.emoji }}</span>
            <div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ w.name }}</div><div style="font-size:11px;color:#9AA4AF;">{{ w.meta }}</div></div>
            <div class="ws-actions" style="display:flex;gap:1px;flex:none;opacity:0;transition:opacity .12s;">
              <span title="上云…" style="{{ w.actBtn }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 13V3M8 7l4-4 4 4"/><path d="M20 17a4 4 0 0 0-3-6.9"/><path d="M4 17a4 4 0 0 1 3-6.9"/><rect x="7" y="17" width="10" height="4" rx="1"/></svg></span>
              <span title="更多" style="{{ w.actBtn }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>
            </div>
          </div>
        </sc-for>

        <!-- Local group -->
        <div style="display:flex;align-items:center;gap:6px;padding:12px 10px 4px;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:#9AA4AF;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9AA4AF" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/></svg>本地设备
        </div>
        <sc-for list="{{ local }}" as="w" hint-placeholder-count="1">
          <div class="ws-row" style="{{ w.rowStyle }}">
            <span style="width:16px;flex:none;display:flex;justify-content:center;">{{ w.tick }}</span>
            <span style="width:28px;height:28px;flex:none;border-radius:7px;background:{{ w.iconBg }};display:flex;align-items:center;justify-content:center;font-size:14px;">{{ w.emoji }}</span>
            <div style="flex:1;min-width:0;"><div style="font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ w.name }}</div><div style="font-size:11px;color:#9AA4AF;">{{ w.meta }}</div></div>
            <div class="ws-actions" style="display:flex;gap:1px;flex:none;opacity:0;transition:opacity .12s;">
              <span title="转为本地副本…" style="{{ w.actBtn }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/></svg></span>
              <span title="更多" style="{{ w.actBtn }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>
            </div>
          </div>
        </sc-for>
      </div>

      <!-- Footer actions -->
      <div style="border-top:1px solid #F1F5F9;padding:6px;">
        <div class="menu-row" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:#2563EB;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span style="font-size:13.5px;font-weight:600;">新建工作区</span>
        </div>
        <div class="menu-row" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:#475569;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span style="font-size:13.5px;">从 Notion 导入…</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const ic = (svg) => React.createElement('span', { dangerouslySetInnerHTML: { __html: svg } });
    const tick = ic('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>');
    const actBtn = 'width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#64748B;cursor:pointer;';
    const mk = (w) => ({
      ...w, tick: w.active ? tick : '',
      actBtn,
      iconBg: w.active ? '#EFF6FF' : '#F1F5F9',
      rowStyle: `display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;${w.active?'background:#F5F9FF;':''}`,
    });
    const cloud = [
      { emoji:'📗', name:'我的工作区', meta:'248 页 · 3 成员 · 已同步', active:true },
      { emoji:'📘', name:'团队 Wiki', meta:'96 页 · 8 成员' },
    ].map(mk);
    const local = [
      { emoji:'📓', name:'草稿本', meta:'仅本设备 · 12 页' },
    ].map(mk);
    return { cloud, local };
  }
}
</script>
</body>
</html>
