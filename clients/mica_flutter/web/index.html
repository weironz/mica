<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Mica Flutter client">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mica</title>
    <!-- Tab icon. SVG only, on purpose: it is the same mark the app draws in its
         sidebar (web/favicon.svg mirrors lib/widgets/mica_logo.dart), it stays
         crisp at any DPI, and every browser that can run a Flutter web build
         supports it. There was no icon of any kind here before, so the tab showed
         the browser's generic globe. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#1D4ED8">
    <!-- The page around the canvas, before Flutter has painted and wherever the
         canvas does not reach (overscroll, the scrollbar gutter). Without these two
         the shell is white while a dark-mode app loads into it, which reads as a
         flash of the wrong app. `color-scheme` is what makes the browser's own
         chrome — scrollbars, form controls, the canvas backdrop — follow along; the
         values mirror MicaTokens' `surface.base` in each palette. -->
    <meta name="color-scheme" content="light dark">
    <style>
      body { margin: 0; background: #FFFFFF; }
      @media (prefers-color-scheme: dark) {
        body { background: #0F1419; }
      }
    </style>
    <!-- P2-M4 web→yjs: the browser-side CRDT engine (yjs), wire-compatible with
         the Rust yrs core/server. Loaded before Flutter so js_interop can use it. -->
    <script src="yjs_bundle.js"></script>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
