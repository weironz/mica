<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Mica Flutter client">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mica</title>
    <!-- Tab icon. SVG only, on purpose: it stays crisp at any DPI and every
         browser that can run a Flutter web build supports it. There was no icon
         of any kind here before, so the tab showed the browser's generic globe.

         web/favicon.svg is a BYTE-FOR-BYTE COPY of assets/mica-logo.svg, the one
         source for the mark: the tab icon has to exist before Flutter boots, so
         it cannot be generated by the app. test/mica_logo_test.dart compares the
         two and fails if they drift — a copy that nothing checks is how the tray
         icon stayed the stock Flutter logo for over a month. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#6357E8">
    <!-- The page around the canvas, before Flutter has painted and wherever the
         canvas does not reach (overscroll, the scrollbar gutter). Without these two
         the shell is white while a dark-mode app loads into it, which reads as a
         flash of the wrong app. `color-scheme` is what makes the browser's own
         chrome — scrollbars, form controls, the canvas backdrop — follow along; the
         values mirror MicaTokens' `surface.base` in each palette. -->
    <meta name="color-scheme" content="light dark">
    <style>
      body { margin: 0; background: #FFFFFF; }
      @media (prefers-color-scheme: dark) {
        body { background: #0F1419; }
      }
      /* Shown from the first byte of HTML until Flutter's first frame (removed
         by the startup script below). Fades in after a beat so a warm start
         that paints within ~300 ms never flashes it. */
      #mica-splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        opacity: 0; animation: mica-splash-in 240ms ease-out 300ms forwards;
      }
      #mica-splash svg { width: 48px; height: 48px; }
      @keyframes mica-splash-in { to { opacity: 1; } }
    </style>
    <!-- A browser reporting a POSIX locale name ("C", "POSIX") makes the Flutter
         engine throw `RangeError: Incorrect locale information provided` from
         `new Locale`, INSIDE its own startup — before `main()` runs, so
         `runZonedGuarded` never sees it and the console stays empty. The result is
         a blank page with no diagnostic whatsoever.

         Reproduced with `newContext({locale: 'C'})`: the app does not boot at all,
         while 'en', 'en-US', 'zh-CN' and an unset locale are all fine. `C` is the
         default on minimal Linux images and CI runners, and reachable for a user
         whose environment or privacy tooling strips the real value.

         The throw is inside the engine, so it cannot be caught from Dart. What CAN
         be fixed is the input: sanitise it here, before flutter_bootstrap.js runs.
         Deliberately narrow — anything that already looks like a language tag is
         left exactly as it is, so this cannot change the language a real user
         gets. -->
    <script>
      (function () {
        // BCP-47 shape only: 2–3 letter primary subtag, optional -SUBTAG parts.
        var TAG = /^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$/;
        var FALLBACK = 'en';
        function clean(tag) {
          return typeof tag === 'string' && TAG.test(tag) ? tag : null;
        }
        try {
          var list = (navigator.languages || []).map(clean).filter(Boolean);
          var single = clean(navigator.language);
          if (single && list.indexOf(single) === -1) list.unshift(single);
          // Only intervene when NOTHING usable was reported. A browser with one odd
          // entry among valid ones needs no help from us.
          if (list.length === 0) {
            list = [FALLBACK];
            Object.defineProperty(navigator, 'language', {
              get: function () {
                return FALLBACK;
              },
              configurable: true,
            });
          }
          Object.defineProperty(navigator, 'languages', {
            get: function () {
              return list;
            },
            configurable: true,
          });
        } catch (e) {
          // Never let the guard itself become the reason the app does not start.
        }
      })();
    </script>
    <!-- Cold start. Before this, the four big downloads ran one after another:
         index.html -> the engine glue -> flutter_bootstrap.js -> canvaskit +
         main.dart.js -> FontManifest -> fonts, each waiting for the previous
         to arrive, while the page stayed blank white. Preload hints start every
         file the first frame needs as soon as this HTML is parsed, so latency is
         paid once instead of per hop.

         The CanvasKit variant mirrors flutter.js's own choice (Chromium build
         when ImageDecoder + v8BreakIterator + Segmenter exist), so Firefox and
         Safari do not download a 2 MB file they will not use. `fetch` preloads
         carry crossorigin because the engine fetches with CORS mode; without it
         the browser downloads them twice.

         The splash element is removed on Flutter's first frame. Inline (not a
         file) so it costs no round trip; its hash is in nginx's CSP. -->
    <script>
      (function () {
        var chromium = typeof ImageDecoder !== 'undefined' &&
          typeof Intl.v8BreakIterator !== 'undefined' &&
          typeof Intl.Segmenter !== 'undefined';
        var ck = chromium ? 'canvaskit/chromium/' : 'canvaskit/';
        var links = [
          ['modulepreload', ck + 'canvaskit.js'],
          ['preload', ck + 'canvaskit.wasm', 'fetch'],
          ['preload', 'main.dart.js', 'script'],
          ['preload', 'mica_md/mica_md_bg.wasm', 'fetch'],
          ['preload', 'mica_doc/mica_doc_bg.wasm', 'fetch'],
          ['preload', 'assets/FontManifest.json', 'fetch'],
          ['preload', 'assets/fonts/fallback/Roboto-Regular.ttf', 'fetch'],
          ['preload', 'assets/fonts/RobotoMono-Regular.ttf', 'fetch'],
          ['preload', 'assets/fonts/MaterialIcons-Regular.otf', 'fetch']
        ];
        for (var i = 0; i < links.length; i++) {
          var link = document.createElement('link');
          link.rel = links[i][0];
          link.href = links[i][1];
          if (links[i][2]) link.as = links[i][2];
          if (links[i][2] === 'fetch') link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        }
        window.addEventListener('flutter-first-frame', function () {
          var splash = document.getElementById('mica-splash');
          if (splash) splash.remove();
        }, { once: true });
      })();
    </script>
  </head>
  <body>
    <!-- Inline, not <img src>: an image request would queue behind the big
         preloads above and the splash would appear about when Flutter does.
         The engine scripts sit BELOW it so the browser can paint the splash
         while it waits on them. -->
    <div id="mica-splash" aria-hidden="true"><svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
>

</svg></div>
    <!-- Start the Markdown engine before Flutter; startup awaits micaMdReady.
         Catch synchronous loader failures as well so Flutter can degrade. -->
    <script src="mica_md/mica_md.js"></script>
    <script>
      globalThis.micaMdReady = Promise.resolve()
        .then(() => wasm_bindgen({ module_or_path: 'mica_md/mica_md_bg.wasm' }))
        .then(() => { globalThis.micaMd = wasm_bindgen; })
        .catch((error) => { globalThis.micaMdError = String(error); });
    </script>
    <!-- The document engine: the same Rust CRDT core (yrs) desktop runs over
         FFI and the server natively, as wasm. Fetched in parallel with the
         Markdown engine; startup awaits micaDocReady before the first sync
         session. Its own global name, since mica_md's glue owns wasm_bindgen. -->
    <script src="mica_doc/mica_doc.js"></script>
    <script>
      globalThis.micaDocReady = Promise.resolve()
        .then(() => mica_doc_bindgen({ module_or_path: 'mica_doc/mica_doc_bg.wasm' }))
        .then(() => { globalThis.micaDoc = mica_doc_bindgen; })
        .catch((error) => { globalThis.micaDocError = String(error); });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
