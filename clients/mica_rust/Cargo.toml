[package]
name = "mica-rust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false
description = "Mica L3 pure-Rust cross-platform UI shell (Route 2-B: owned mica-editor + NSH native virtual_list / Canvas / IME)"

[lib]
name = "mica_rust"
path = "src/lib.rs"

[[bin]]
name = "mica-rust"
path = "src/main.rs"

[dependencies]
# L1 + L2 pure-Rust Mica cores (single source of truth, zero FFI/JSON bridge).
mica-api-types = { path = "../../crates/api-types" }
mica-board = { path = "../../crates/mica-board" }
mica-client = { path = "../../crates/mica-client" }
mica-core = { path = "../../crates/mica-core" }
mica-editor = { path = "../../crates/mica-editor" }
mica-md = { path = "../../crates/md-core", features = ["render"] }
mica-sync = { path = "../../crates/mica-sync" }

# L3 Native Shell presentation primitives (default-features = false drops
# duplicate rich-editor/syntect/zstd-sys/math so Mica's own L1/L2 engines rule).
nsh-core = "0.6.1"
nsh-base = { version = "0.6.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "0.6.1"

[dev-dependencies]
nsh-engine = "0.6.1"
nsh-testing = { version = "0.6.1", features = ["live"] }

# Standalone workspace root so the L3 UI shell stays isolated from server/CLI CI.
[workspace]
