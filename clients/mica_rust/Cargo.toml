[package]
name = "mica-rust"
version = "0.14.11"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false
description = "Mica L3 pure-Rust cross-platform client (Route 2-B: owned L1/L2 Rust cores + NSH native desktop & Web shell)"

[lib]
name = "mica_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mica-rust"
path = "src/main.rs"

[dependencies]
# L1 + L2 pure-Rust Mica cores (single source of truth, zero FFI/JSON bridge).
mica-api-types = { path = "../../crates/api-types" }
mica-board = { path = "../../crates/mica-board" }
mica-client = { path = "../../crates/mica-client" }
mica-core = { path = "../../crates/mica-core" }
mica-editor = { path = "../../crates/mica-editor" }
mica-interchange = { path = "../../crates/interchange" }
# On Web (`wasm32`), only `render-board` stays in the main bundle; Math (`ratex`)
# and Mermaid (`merman`) are lazy-loaded via `mica_preview/{math,mermaid}.wasm`
# on first use so ordinary pages pay zero parser/layout/font weight at startup.
mica-md = { path = "../../crates/md-core", features = ["render-board"] }
mica-sync = { path = "../../crates/mica-sync" }

# L3 Native Shell presentation primitives: enable only `editor` (pure-Rust code
# editor via ropey for code blocks); document editing runs on Mica's own
# `crates/mica-editor` + NSH native `virtual_list` (Route 2-B, zero `rich-editor`).
nsh-core = "0.6.1"
nsh-base = { version = "0.6.1", default-features = false, features = ["editor"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["serde", "v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mica-core = { path = "../../crates/mica-core", features = ["store"] }
mica-md = { path = "../../crates/md-core", features = ["render"] }
mica-sync = { path = "../../crates/mica-sync", features = ["sqlite"] }
dirs-next = "2"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
nsh-platform-web = { version = "0.6.1", default-features = false }
uuid = { version = "1.11", features = ["serde", "v4", "js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "CloseEvent",
  "Document",
  "DomException",
  "DomStringList",
  "Element",
  "ErrorEvent",
  "Event",
  "File",
  "FileList",
  "FileReader",
  "Headers",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbVersionChangeEvent",
  "Location",
  "MessageEvent",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "Response",
  "Storage",
  "Url",
  "WebSocket",
  "Window",
] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "0.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "0.6.1"

[dev-dependencies]
nsh-engine = "0.6.1"
nsh-testing = { version = "0.6.1", features = ["live"] }

# Standalone workspace root so the L3 UI shell stays isolated from server/CLI CI.
[workspace]

[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
