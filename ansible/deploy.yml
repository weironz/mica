# Roll the production stack to a published version.
#
#   just deploy-prod 0.13.27              # real
#   just deploy-prod 0.13.27 --check --diff   # rehearsal, changes nothing
#
# Do not run this playbook directly: it needs `compose_src` pointing at the
# compose file AS IT EXISTS AT THE TAG, and scripts/deploy-prod.sh is what
# extracts it with `git show`. Running it bare fails with that message.
#
# This replaces the node-side `/usr/local/sbin/mica-deploy` fence. What changed
# and why is in docs/cd-plan.md; the one thing worth repeating here is the
# failure it removes:
#
#   The node used to keep its OWN copy of docker-compose.yaml, and CI passed the
#   sha256 of the file AT THE TAG. Any difference and the node refused. Which
#   meant every compose change — a quota, a feature flag, a backup variable —
#   made the next deploy fail until somebody ran the laptop fallback. Config
#   changes are a large share of all deploys, so the fallback became the main
#   path, which is the definition of a main path nobody designed.
#
#   Now the file is SHIPPED from the tag on every run. Drift cannot exist,
#   because the node's compose is by construction the one this version was
#   released with. There is nothing left to compare.
#
# Provisioning (docker, directories, Traefik, first-time secrets) is NOT here.
# docs/cd-plan.md §6 is explicit that nobody has walked that path by hand yet,
# and a runbook nobody has walked should not be frozen into code — the code
# would preserve the guesses and stop anyone from reading the doc.
- name: Deploy Mica
  # Defaults to prod, which is what scripts/deploy-prod.sh wants and passes
  # nothing for. `-e target=mica-dr` points the SAME playbook at the DR drill
  # machine — reusing this rather than hand-rolling a second bring-up path is
  # the point: a recovery procedure that is not the everyday procedure is a
  # procedure nobody has tested.
  hosts: "{{ target | default('mica-prod') }}"
  gather_facts: false

  # Every docker step is a community.docker module rather than `command: docker
  # compose …`. Two things follow that shelling out cannot give:
  #   - `--check` becomes a REAL rehearsal (the modules run compose --dry-run)
  #     instead of `skipping:`, so the dress rehearsal exercises the same code.
  #   - no quoting. The shell version had to escape through bash -> just -> ssh
  #     -> bash, and every layer got it wrong at least once.
  collections: [community.docker]

  vars:
    # NOT defaulted to the working tree, on purpose. The caller must hand over a
    # file it materialised from the TAG, and both callers do —
    # scripts/deploy-prod.sh and .github/workflows/deploy.yml.
    #
    # Defaulting to the checkout would restore a bug this repo already paid for:
    # deploying 0.12.6 from a branch that had moved on shipped prod a compose
    # from a DIFFERENT version, and nothing announced it — the deploy just
    # succeeded with a file nobody reviewed as part of that release. A default
    # that is right most of the time is exactly how that goes unnoticed, so
    # there is no default and a bare run fails with instructions.
    compose_src: ""
    compose_dst: "{{ mica_dir }}/docker-compose.yaml"
    env_file: "{{ mica_dir }}/.env"
    secrets_file: "{{ mica_dir }}/.env.secrets"
    # Started first and waited for. A migration that runs against a database
    # still coming up fails in a way that looks like a code bug — and api mounts
    # rustfs as its object store, so that is a data service by the same argument.
    data_services: [postgres, rustfs]

  tasks:
    # ── Refuse before writing anything ───────────────────────────────────────
    # Every assertion here runs BEFORE .env or the compose file is touched, so a
    # bad input leaves the node exactly as it was rather than half-applied.
    - name: The version must be X.Y.Z
      ansible.builtin.assert:
        that: version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          version must be X.Y.Z with no leading v (got '{{ version | default("") }}').
          Prod pins exact versions so a restart comes back on the same one.
      delegate_to: localhost

    - name: A compose file must have been handed over
      ansible.builtin.assert:
        that: compose_src | length > 0
        fail_msg: >-
          compose_src is required and must be the compose file AS AT THE TAG.
          Run `just deploy-prod {{ version | default("X.Y.Z") }}` instead of this
          playbook — it extracts the file with `git show`, so the pairing is
          exact from any checkout state.
      delegate_to: localhost

    - name: Read the compose that is about to be shipped
      ansible.builtin.slurp:
        src: "{{ compose_src }}"
      delegate_to: localhost
      register: compose_raw
      check_mode: false

    # Which services to start is decided by PARSING that file, not by asking the
    # node `docker compose config --services`. Parsing is native, works under
    # --check without special-casing, and — the reason that matters — it reads
    # the file being shipped rather than the one already on the node, so a
    # service added in this release is started by this release.
    - name: Work out what it declares
      ansible.builtin.set_fact:
        # Plain subscript, not json_query: that filter drags in community.general
        # AND a jmespath install on whatever machine runs the deploy, to do what
        # Jinja already does. A deploy path with avoidable dependencies is a
        # deploy path that stops working on a fresh laptop.
        compose_services: "{{ (compose_raw.content | b64decode | from_yaml)['services'] }}"

    # Profile-gated services are excluded here and handled separately below.
    # Rolling them in with the rest would switch a profile ON for a node that
    # deliberately runs without it.
    - name: Split them into data / app / profile-gated
      ansible.builtin.set_fact:
        profile_services: >-
          {{ compose_services | dict2items
             | selectattr('value.profiles', 'defined') | map(attribute='key') | list }}
        app_services: >-
          {{ compose_services | dict2items
             | rejectattr('value.profiles', 'defined') | map(attribute='key') | list
             | reject('in', data_services) | list }}

    - name: Something must actually serve traffic
      ansible.builtin.assert:
        that: app_services | length > 0
        fail_msg: >-
          the compose at this tag declares no non-data, non-profile service —
          nothing would serve traffic. Declared: {{ compose_services.keys() | list }}

    # ── The two halves of the environment ────────────────────────────────────
    # .env         — non-secret config, RENDERED from host_vars every deploy
    # .env.secrets — credentials, written once by a human, never touched here
    #
    # Splitting them is what makes rendering safe. While they shared one file,
    # the only thing this playbook could do was a surgical `lineinfile` on
    # MICA_VERSION, so 21 config values lived exclusively on the node with no
    # source of truth and no way to detect a hand-edit — exactly the disease
    # compose was cured of.
    - name: The credentials file must already exist
      ansible.builtin.stat:
        path: "{{ secrets_file }}"
      register: secrets_stat

    - name: Refuse to invent one
      ansible.builtin.assert:
        that: secrets_stat.stat.exists
        fail_msg: >-
          {{ secrets_file }} is missing. It holds this instance's credentials and
          is created ONCE by a human during provisioning — a deploy that wrote a
          fresh one would silently rotate every credential and orphan the data.
          On a node that predates the split, create it from the old single .env:
          grep -E '^(JWT_SECRET|POSTGRES_PASSWORD|S3_ACCESS_KEY_ID|...)=' .env > .env.secrets

    # Enforced, not remembered. Nothing stops someone pasting a password into
    # host_vars — where it would be committed to a public repo — except a check
    # that refuses to deploy when they do.
    - name: No credential may be defined in host_vars
      ansible.builtin.assert:
        that: mica_env.keys() | select('search', '(?i)secret|password|token|access_key') | list | length == 0
        fail_msg: >-
          {{ mica_env.keys() | select('search', '(?i)secret|password|token|access_key') | list }}
          look like credentials. host_vars is a file in a PUBLIC repo; put these
          in {{ secrets_file }} on the node instead.
      delegate_to: localhost

    # Which keys the node has today, by NAME only — the values are never read.
    # Guards the one way this change can quietly break production: a key that
    # exists on the node but is missing from host_vars simply disappears, and
    # compose then falls back to its own default without saying anything. For a
    # quota or a feature flag that is a silent behaviour change, not an outage,
    # so nothing would catch it.
    - name: Which keys does the credentials file provide?
      ansible.builtin.shell:
        cmd: "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' {{ secrets_file }} | tr -d '=' | sort -u"
      register: secrets_keys
      changed_when: false
      check_mode: false

    - name: Which keys does the node have today?
      ansible.builtin.shell:
        cmd: >-
          cat {{ env_file }} {{ secrets_file }}
          | grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' | tr -d '=' | sort -u
      register: keys_before
      changed_when: false
      check_mode: false

    - name: Nothing the node has may be dropped
      ansible.builtin.assert:
        that: keys_before.stdout_lines | reject('in', rendered_keys) | list | length == 0
        fail_msg: >-
          these keys exist on the node but nothing would render them —
          {{ keys_before.stdout_lines | reject('in', rendered_keys) | list }}.
          Add them to host_vars (config) or {{ secrets_file }} (credentials).
          Deploying now would delete them and let compose silently substitute
          its own defaults.
      vars:
        rendered_keys: >-
          {{ (mica_env.keys() | list) + ['MICA_VERSION']
             + (secrets_keys.stdout_lines | default([])) }}

    # ── What is live right now ───────────────────────────────────────────────
    # Remember what it was FIRST. A deploy that fails half way leaves .env naming
    # a version whose containers never came up, and the next restart — a reboot,
    # an OOM kill — brings the node back on that. The node script this replaces
    # restored it on ANY non-zero exit, and that is worth keeping.
    #
    # Read here, ahead of the first write, for two reasons. The header of this
    # file promises every assertion runs before the compose or .env is touched,
    # and for "there must be a version to fall back to" that was not true: it sat
    # after the compose copy, so it could refuse a deploy having already replaced
    # the node's compose. And the restore point below needs to know which version
    # is live in order to ask whether this release adds migrations.
    # A node with NO .env at all is a different thing from a node whose .env
    # lost its MICA_VERSION line, and only the second one is a problem. The
    # first is a machine that has never been deployed to — the case the whole
    # DR plan turns on, and the case this playbook refused outright until
    # 2026-08-29, when the drill actually pointed it at a fresh machine and it
    # died on `slurp` before any assertion could explain why.
    - name: Is there anything deployed here yet?
      ansible.builtin.stat:
        path: "{{ env_file }}"
      register: env_stat
      check_mode: false

    - name: Name that case
      ansible.builtin.set_fact:
        fresh_node: "{{ not env_stat.stat.exists }}"

    - name: Say so
      ansible.builtin.debug:
        msg: >-
          {{ env_file }} does not exist — treating this as a FIRST deploy:
          no version to fall back to and no restore point to take, because
          there is nothing here yet to lose.
      when: fresh_node | bool

    - name: Read the version currently deployed
      ansible.builtin.slurp:
        src: "{{ env_file }}"
      register: env_before
      check_mode: false
      when: not fresh_node | bool

    - name: Remember it
      ansible.builtin.set_fact:
        # splitlines(), not split('\n'): the escape has to survive a YAML folded
        # scalar before Jinja ever sees it, and it did not — the first rehearsal
        # of the rescue path announced `.env restored to ''`, which would have
        # been a rollback that wrote an EMPTY MICA_VERSION and left compose
        # unable to resolve any image tag at all. A rollback that cannot be
        # rehearsed is a rollback nobody knows the state of.
        previous_version: >-
          {{ '' if fresh_node | bool else
             ((env_before.content | b64decode).splitlines()
              | select('match', '^MICA_VERSION=') | first | default('')
              | regex_replace('^MICA_VERSION=', '') | trim) }}

    # Still refused on an EXISTING node — that is the case the rule was written
    # for. Relaxing it for a fresh one does not weaken it: there is no rollback
    # target because there is nothing deployed to roll back to, and the rescue
    # block below already guards its .env restore on the same emptiness.
    - name: There must be a version to fall back to
      ansible.builtin.assert:
        that: fresh_node | bool or previous_version | length > 0
        fail_msg: >-
          {{ env_file }} exists but has no MICA_VERSION line, so a failed deploy
          would have nothing to restore. Refusing before anything is changed.

    # ── A restore point, when this release adds migrations ───────────────────
    # Migrations ride the api image: sqlx::migrate! embeds migrations/*.sql at
    # COMPILE time and run_migrations applies them at startup. So deploying an
    # api build IS applying its migrations, with no separate step to pause at.
    #
    # Nothing here backed that up. The backup sidecar is a periodic exporter and
    # only runs once api is already up, so it is not a point you can roll back
    # to. Until now the pre-migration dump was step 8 of docs/release.md — a
    # thing a person had to remember, about the one class of change that cannot
    # be undone by redeploying the previous version.
    #
    # A rule that lives only in a document is not a rule here: two gates in this
    # repo were found unpassable the first time they were really used, and both
    # had a document saying they worked.
    - name: Does this release add migrations?
      ansible.builtin.command:
        cmd: git diff --name-only {{ previous_version }}..v{{ version }} -- migrations/
        chdir: "{{ playbook_dir }}/.."
      delegate_to: localhost
      register: migration_diff
      changed_when: false
      check_mode: false
      failed_when: false
      when: not fresh_node | bool

    - name: Decide whether a restore point is needed
      ansible.builtin.set_fact:
        migration_files: "{{ migration_diff.stdout_lines | default([]) }}"
        # A non-zero rc means the question could not be ANSWERED — a tag missing
        # from this checkout, a shallow clone, a previous_version that was never
        # published. Treating that as "no migrations" would skip the backup in
        # precisely the case where least is known, so unknown counts as yes. The
        # cost of a wrong yes is some node IO; of a wrong no, the database.
        # A fresh node is the one case where "unknown" does NOT mean yes: there
        # is no database to dump, and asking for one would fail the deploy on
        # `docker exec mica-postgres-1` against a container that does not exist.
        needs_restore_point: >-
          {{ false if fresh_node | bool else
             (migration_diff.rc != 0
              or (migration_diff.stdout_lines | default([]) | length) > 0) }}

    - name: Say what that means
      ansible.builtin.debug:
        msg: >-
          {{ ('migrations added by this release: ' ~ (migration_files | join(', ')))
             if migration_files | length > 0
             else (('cannot tell whether ' ~ previous_version ~ '..v' ~ version
                    ~ ' adds migrations (' ~ (migration_diff.stderr | default('') | trim)
                    ~ ') — taking a restore point anyway')
                   if needs_restore_point | bool
                   else ('no migrations between ' ~ previous_version ~ ' and v' ~ version
                         ~ ' — no restore point needed')) }}

    # Deliberately NOT check_mode: false — a rehearsal must not write a 100 MB
    # file to the node. It is skipped there, and the debug above is what a
    # rehearsal reports instead.
    - name: Take a restore point before the migrations run
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          f={{ mica_dir }}/pre-{{ version }}-$(date +%Y%m%d-%H%M%S).sql.gz
          # `set -o pipefail` (in -euo above) is load-bearing, not style: without
          # it a pg_dump that dies still leaves a perfectly well-formed gzip of
          # nothing, and `gzip -t` PASSES on that. The check would confirm a
          # backup that contains no backup.
          docker exec mica-postgres-1 pg_dump -U mica -d mica | gzip > "$f" \
            || { rm -f "$f"; exit 1; }
          gzip -t "$f" || { rm -f "$f"; exit 1; }
          # Structure, not just "is it a valid gzip". The trailer proves pg_dump
          # reached the end rather than being cut off; the COPY line proves the
          # table every document's content lives in is actually inside. One awk
          # pass and not `zcat | grep -q`, because grep -q exits early, zcat
          # takes SIGPIPE, and under pipefail that reads as failure.
          zcat "$f" | awk '
            /^COPY public\.document_yrs_base/       { t = 1 }
            /PostgreSQL database dump complete/     { d = 1 }
            END { exit !(t && d) }' || { rm -f "$f"; exit 1; }
          echo "$f"
      register: restore_point
      when: needs_restore_point | bool
      # Every failure path above removes the partial file first, so a full disk
      # or a stopped postgres leaves nothing behind — and stops the deploy here,
      # before a single byte of the node's config has been touched. Refusing to
      # migrate without a restore point is the whole point of the task.

    # These pile up forever otherwise: one per migrating deploy, ~130 MB each by
    # 2026-08, and nothing ever removed them (80 files / 2.1 GB on 2026-08-29,
    # oldest from July). Pruning belongs HERE rather than in a cron: the file is
    # created by this task, so the rule for how long it lives should be readable
    # in the same place.
    #
    # Five is "the deploys you might still roll back", not a storage budget. A
    # restore point older than that is neither a rollback (the schema has moved
    # on — 0016 was irreversible) nor a disaster copy: it sits on the SAME DISK
    # as the database it came from. The off-site rustic `_pgdump` lineage is the
    # one that survives losing this machine, and it keeps its own retention.
    - name: Keep only the five newest restore points
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          cd {{ mica_dir }}
          # `ls -t` on a glob that matches nothing would error under pipefail;
          # the `|| true` keeps a fresh node (no restore points yet) deploying.
          ls -t pre-*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -f || true
      changed_when: false
      when: needs_restore_point | bool

    - name: Where the restore point is
      ansible.builtin.debug:
        # Branch on `skipped` rather than leaning on a default for the missing
        # stdout: a skipped task DOES register a result, and `.stdout | default()`
        # on it produced the empty string instead of the fallback — so the first
        # rehearsal announced `restore point: ` with nothing after it, which
        # reads as "took one and lost the path". A dry run that describes itself
        # as having done the thing is worse than one that says nothing.
        msg: >-
          {{ 'rehearsal — a restore point WOULD be taken here, nothing was written'
             if (restore_point.skipped | default(false))
             else ('restore point: ' ~ (restore_point.stdout | default('') | trim)) }}
      when: needs_restore_point | bool

    # ── Ship the compose from the tag ────────────────────────────────────────
    # The FIRST write of the run. Everything above only reads and refuses, so up
    # to this line a failure leaves the node exactly as it was found.
    #
    # The node's file is docker-compose.yaml (not .yml): keep that name, or
    # compose finds two files and picks the other one.
    - name: Install docker-compose.yaml from the tag
      ansible.builtin.copy:
        src: "{{ compose_src }}"
        dest: "{{ compose_dst }}"
        mode: "0644"
        backup: true
      register: compose_copy

    # ── Point .env at the version ────────────────────────────────────────────
    # MICA_VERSION carries the v prefix: compose uses the value directly as the
    # image tag (`mica-api:${MICA_VERSION}`) and the published tags have it.
    # Writing the bare number makes compose pull a tag that does not exist —
    # caught by `--check --diff` before it ever ran, which is the entire point of
    # a rehearsal that talks to the real node.
    - name: Render .env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ env_file }}"
        mode: "0640"
        backup: true
      vars:
        mica_version: "v{{ version }}"
      register: env_render

    - name: Install the ./dc wrapper
      ansible.builtin.template:
        src: dc.j2
        dest: "{{ mica_dir }}/dc"
        mode: "0755"

    # ── Roll ─────────────────────────────────────────────────────────────────
    # Wrapped so a failure puts .env back. The compose file is deliberately NOT
    # rolled back: restoring an old compose under a new version's images, or the
    # reverse, is half a rollback, which is worse than none.
    - name: Roll the stack
      block:
        # ONLY the app services. They are the ones keyed to MICA_VERSION and
        # published to MICA_REGISTRY (an ACR mirror in CN); postgres and rustfs
        # are pinned third-party images from Docker Hub that are already on the
        # node and do not move between releases.
        #
        # This is not an optimisation. The node cannot reach registry-1.docker.io
        # at all — pulling everything fails with `dial tcp … i/o timeout`, which
        # is exactly how the first rehearsal of this playbook ended. The script
        # it replaces said `docker compose pull api web` and that list was load-
        # bearing, not a shortcut.
        - name: Pull the images for this version
          community.docker.docker_compose_v2_pull:
            project_src: "{{ mica_dir }}"
            # BOTH files, in this order — same as ./dc. Handing over only .env
            # does not fail: the credentials resolve to empty strings and the
            # containers come up unauthenticated, which is the quiet kind of
            # broken.
            env_files: ["{{ env_file }}", "{{ secrets_file }}"]
            services: "{{ app_services }}"
            policy: always

        # The data plane is INSPECTED, not brought up. `docker compose up -d
        # postgres` looks harmless and is not: compose compares its config hash,
        # and the containers running on this node were created from an older
        # compose, so a rehearsal showed it would RECREATE mica-postgres-1 and
        # mica-rustfs-1 — a database bounce on every version roll. The script
        # this replaces said `--no-deps api web` and never touched them; that
        # was the point of the flag, not an optimisation.
        #
        # Bouncing the data plane is a real operation with real downtime. It
        # should be something somebody decides to do, never a side effect of
        # shipping a new api build.
        # no_log, and then reduced to three scalars before anything loops over
        # it. docker_container_info returns the whole inspect payload, and that
        # includes `Config.Env` — the container's LIVE CREDENTIALS. Ansible
        # attaches the loop item to every per-item result, so a later task
        # looping over these results prints those credentials at normal
        # verbosity, with no --diff and no -v needed.
        #
        # That is not hypothetical. It happened here on 2026-08-25: three Deploy
        # runs published POSTGRES_PASSWORD, RUSTFS_ACCESS_KEY and
        # RUSTFS_SECRET_KEY into the Actions log of a PUBLIC repository. The
        # values were rotated and the runs deleted, but "deleted" is not
        # "unseen".
        #
        # no_log alone would only hide the display. Reducing the data is what
        # actually fixes it: after this, the secrets are not in a variable that
        # any later task could print by accident.
        - name: Look at the data services
          community.docker.docker_container_info:
            name: "mica-{{ item }}-1"
          loop: "{{ data_services }}"
          register: data_info_raw
          check_mode: false
          no_log: true

        - name: Keep only what the checks actually need
          ansible.builtin.set_fact:
            data_state: >-
              {{ (data_state | default([])) + [{
                   'name': item.item,
                   'running': (item.container.State.Running | default(false)),
                   'health': (item.container.State.Health.Status | default('none'))
                 }] }}
          loop: "{{ data_info_raw.results }}"
          loop_control:
            label: "{{ item.item }}"
          no_log: true

        # Still the "migrations must not race a starting database" guarantee,
        # arrived at by refusing rather than by restarting.
        - name: Refuse to deploy over a data service that is not up and healthy
          ansible.builtin.assert:
            # Reads as: IF it is running, it must be healthy. A stopped or
            # missing one is not an error here — the next task starts it.
            # Written the other way round first, which would have refused the
            # deploy on exactly the fresh-node case the next task exists for.
            that:
              - not item.running or item.health in ['healthy', 'none']
            fail_msg: >-
              mica-{{ item.name }}-1 is running but {{ item.health }}.
              Deploying api on top of a sick data plane turns an infrastructure
              problem into what looks like a bad release. Fix it first.
          loop: "{{ data_state }}"
          loop_control:
            label: "{{ item.name }}"

        # Only when one is genuinely absent or stopped — a fresh node, or after a
        # reboot that did not bring everything back. Then starting it IS the
        # right thing, and `wait` makes the next task safe.
        - name: Start a data service that is not running at all
          community.docker.docker_compose_v2:
            project_src: "{{ mica_dir }}"
            # BOTH files, in this order — same as ./dc. Handing over only .env
            # does not fail: the credentials resolve to empty strings and the
            # containers come up unauthenticated, which is the quiet kind of
            # broken.
            env_files: ["{{ env_file }}", "{{ secrets_file }}"]
            services: "{{ [item.name] }}"
            state: present
            wait: true
            wait_timeout: 240
          loop: "{{ data_state }}"
          loop_control:
            label: "{{ item.name }}"
          when: not item.running

        # `dependencies: false` is --no-deps: the data services are already up
        # and waited for above. Without it compose is free to restart them as
        # dependencies, which is a database bounce nobody asked for mid-deploy.
        #
        # `wait` replaces a hand-rolled `for i in $(seq 1 60)` health loop whose
        # docker-inspect format string was mis-escaped and reported "api NOT
        # healthy" over healthy deploys. Same 240s budget, none of the quoting.
        - name: Start the application services and wait for them
          community.docker.docker_compose_v2:
            project_src: "{{ mica_dir }}"
            # BOTH files, in this order — same as ./dc. Handing over only .env
            # does not fail: the credentials resolve to empty strings and the
            # containers come up unauthenticated, which is the quiet kind of
            # broken.
            env_files: ["{{ env_file }}", "{{ secrets_file }}"]
            services: "{{ app_services }}"
            state: present
            dependencies: false
            remove_orphans: true
            wait: true
            wait_timeout: 240

        # The backup sidecar runs mica-cli, so it is keyed to the SAME
        # MICA_VERSION and drifts unless a version roll moves it too — it sat on
        # willdockerhub/mica-cli:v0.3 for many releases because deploy skipped
        # it. Refresh it ONLY where it already exists, so a deploy never turns
        # backup on for a node that runs without it.
        #
        # Container name rather than `compose ps`: compose names them
        # <project>-<service>-1 and the project is the directory, mica. The same
        # convention was already load-bearing in the script this replaces.
        # Same no_log + reduce as the data services above, and for the same
        # reason: this inspect payload carries the backup sidecar's Config.Env,
        # which holds the OSS keys and MICA_BACKUP_PASSWORD.
        - name: Is the backup sidecar present on this node?
          community.docker.docker_container_info:
            name: "mica-{{ item }}-1"
          loop: "{{ profile_services }}"
          register: sidecars_raw
          check_mode: false
          no_log: true

        - name: Keep only which of them exist
          ansible.builtin.set_fact:
            sidecars_present: >-
              {{ (sidecars_present | default([]))
                 + ([item.item] if (item.exists | default(false)) else []) }}
          loop: "{{ sidecars_raw.results }}"
          loop_control:
            label: "{{ item.item }}"
          no_log: true

        - name: Refresh the profile-gated sidecars that are present
          community.docker.docker_compose_v2:
            project_src: "{{ mica_dir }}"
            # BOTH files, in this order — same as ./dc. Handing over only .env
            # does not fail: the credentials resolve to empty strings and the
            # containers come up unauthenticated, which is the quiet kind of
            # broken.
            env_files: ["{{ env_file }}", "{{ secrets_file }}"]
            profiles: "{{ [item] }}"
            services: "{{ [item] }}"
            state: present
            pull: always
            dependencies: false
          loop: "{{ sidecars_present | default([]) }}"
      rescue:
        # Restore the BACKUP, rather than patching MICA_VERSION back or
        # re-rendering with the old version. Both of those reconstruct a state
        # that never existed — this release's config wearing the previous
        # release's version number — and nothing downstream would find that
        # odd. The backup is the actual previous state, byte for byte.
        #
        # `backup_file` is only set when the render changed something; if it did
        # not, .env is already what it was and there is nothing to undo.
        - name: Put .env back exactly as it was
          ansible.builtin.copy:
            src: "{{ env_render.backup_file }}"
            dest: "{{ env_file }}"
            remote_src: true
            mode: "0640"
          when: env_render.backup_file is defined

        - name: Best-effort restart on the previous version
          community.docker.docker_compose_v2:
            project_src: "{{ mica_dir }}"
            # BOTH files, in this order — same as ./dc. Handing over only .env
            # does not fail: the credentials resolve to empty strings and the
            # containers come up unauthenticated, which is the quiet kind of
            # broken.
            env_files: ["{{ env_file }}", "{{ secrets_file }}"]
            state: present
            dependencies: false
          failed_when: false
          when: previous_version | length > 0

        - name: Fail loudly
          ansible.builtin.fail:
            msg: >-
              deploy of {{ version }} failed; .env restored to
              '{{ previous_version | default("(unknown)") }}'. The stack was asked
              to come back up on it — CHECK /api/ready before assuming it did.

    - name: Report what landed
      ansible.builtin.debug:
        msg: >-
          {{ version }} — compose {{ 'UPDATED' if compose_copy.changed else 'unchanged' }};
          data: {{ data_services | join(', ') }};
          app: {{ app_services | join(', ') }};
          profile-gated: {{ profile_services | join(', ') | default('none', true) }}
