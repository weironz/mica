# The production node. One host, on purpose — see docs/cd-plan.md §5 for why
# there is no second one.
#
# Reached by SSH key as root. That is a DELIBERATE loosening of what came
# before, where the deploy key was pinned to a single command
# (`restrict,command=/usr/local/sbin/mica-deploy`) so a compromised CI could
# only move prod between published versions. Ansible cannot work that way — it
# pushes modules to the host and executes them — so adopting it means giving
# that fence up. The reasoning is written down in docs/cd-plan.md §4; the short
# version is that CI already holds registry push credentials, so a compromised
# CI could publish a malicious image the node would pull and run anyway. The
# fence closed one door in a room with another door open.
all:
  hosts:
    mica-prod:
      ansible_host: mica.cloudcele.com
      ansible_user: root
      ansible_python_interpreter: /usr/bin/python3

    # The DR drill machine. Its IP changes every drill (tofu creates it fresh),
    # so it comes from the environment rather than being committed:
    #
    #     DR_HOST=$(cd dr/aliyun && tofu output -raw public_ip)
    #
    # Deliberately NOT generated into a file by tofu: a stale generated
    # inventory pointing at a destroyed machine is worse than no inventory,
    # because it looks authoritative.
    mica-dr:
      ansible_host: "{{ lookup('env', 'DR_HOST') }}"
      ansible_user: root
      ansible_python_interpreter: /usr/bin/python3
  vars:
    # Everything the node keeps lives here: .env (rendered), docker-compose.yaml
    # (shipped from the tag), and the backup dumps.
    #
    # THESE TWO ARE THE ONLY PLACE THE LAYOUT IS DECIDED. Move the deployment to
    # /opt/mica and everything that writes to the node follows — the playbooks
    # use the variables, and .github/workflows/dr-drill.yml reads mica_dir out
    # of THIS file rather than keeping its own copy.
    #
    # The backup is unaffected either way: it stores the file at its CONTAINER
    # path (/etc/mica/env.secrets), which compose decides, so a backup taken on
    # one layout restores onto another.
    mica_dir: /data/mica
    traefik_dir: /data/traefik
