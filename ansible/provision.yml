# Bring a BARE machine to the point where deploy.yml can run: docker, the
# directories, the shared network, and Traefik in front.
#
#     ansible-playbook -i ansible/inventory.yml ansible/provision.yml -e target=mica-dr
#
# Split from deploy.yml on purpose, and NOT folded into it: deploy runs on every
# release against a machine that already has all of this, and re-checking
# apt repositories on every version roll buys nothing. Two playbooks rather than
# two roles — a role earns its keep when something else includes it, and today
# each of these has exactly one caller. `site.yml` can import both if the day
# comes.
#
# WHY THIS EXISTS AT ALL: until 2026-08-29 this layer was written down only as
# prose in docs/dr-drill.md, and deploy.yml says in its own header that CI must
# "never install it". Walking the drill by hand found two things that no amount
# of re-reading the prose would have:
#
#   1. `curl get.docker.com | sh` FAILS from a mainland-China ECS —
#      download.docker.com resets the connection. The Aliyun mirror works.
#   2. The node cannot reach registry-1.docker.io AT ALL, so the three
#      third-party images (postgres, rustfs, traefik) cannot be pulled on a
#      fresh machine. Production only works because they were already there.
#      See `third_party_registry` below.
#
# `target` is required and has no default: this playbook installs packages and
# restarts Traefik, and `hosts: all` with a forgotten --limit would do that to
# production.
- name: Provision a Mica node
  hosts: "{{ target }}"
  gather_facts: true
  collections: [community.docker]

  vars:
    # Docker's own apt repo is unreachable from mainland China (measured
    # 2026-08-29: `Recv failure: Connection reset by peer` against
    # download.docker.com, from an Aliyun cn-shenzhen ECS). Point this at
    # https://download.docker.com/linux/ubuntu outside China.
    docker_apt_repo: "https://mirrors.aliyun.com/docker-ce/linux/ubuntu"
    traefik_dir: /data/traefik

    # Docker Hub is unreachable from this node — not slow, unreachable:
    # `dial tcp 111.243.214.169:443: i/o timeout` for every pull (measured
    # 2026-08-29 on a fresh cn-shenzhen ECS; that IP is a poisoned answer).
    # The three third-party images below therefore cannot be fetched at all,
    # which means a BRAND NEW MACHINE CANNOT START THE STACK. Production only
    # works because those images were pulled onto it long ago.
    #
    # DECISION (user, 2026-08-29): use a pull-through mirror rather than copying
    # the three images into our own registry. The reason is maintenance, not
    # convenience — a private copy has to be re-synced by hand every time
    # postgres or traefik moves, and "remember to mirror the new tag" is exactly
    # the kind of step that is skipped until the day it matters.
    #
    # THE COST, stated plainly: we are trusting these hosts to serve us an
    # unmodified postgres. That is a supply-chain dependency we do not control.
    # It is accepted on the condition below — a failed pull must STOP the play
    # loudly and wait for a human, never fall through to a half-built machine.
    docker_registry_mirrors:
      - "https://docker.m.daocloud.io"
      - "https://docker.1ms.run"

    # Everything the stack needs that is NOT ours. Pulled here, so that "provision
    # finished" actually means "this machine can start the stack offline of
    # Docker Hub" — deploy.yml only pulls the app images.
    third_party_images:
      - "{{ traefik_env.TRAEFIK_IMAGE_TAG }}"
      - postgres:18.6-alpine
      - rustfs/rustfs:1.0.0-rc.3

  tasks:
    - name: Refuse to run without an explicit target
      ansible.builtin.assert:
        that: target is defined and target | length > 0
        fail_msg: "Pass -e target=<host>. There is no default on purpose."
      run_once: true
      delegate_to: localhost

    # ── Docker ────────────────────────────────────────────────────────────────

    - name: Install the packages apt needs to add a signed repository
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Fetch the Docker signing key
      ansible.builtin.get_url:
        url: "{{ docker_apt_repo }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    # ansible_distribution_release, not a hardcoded codename: Ubuntu 26.04 is
    # `resolute`, and the drill machine's image tracks whatever is current when
    # the machine is created — which in a real recovery is not the codename
    # anybody remembered.
    - name: Add the Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          {{ docker_apt_repo }} {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Point Docker at the pull-through mirrors
      ansible.builtin.copy:
        content: "{{ {'registry-mirrors': docker_registry_mirrors} | to_nice_json }}
"
        dest: /etc/docker/daemon.json
        mode: "0644"
      notify: Restart Docker

    - name: Start Docker and have it survive a reboot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    # Before anything tries to USE the mirrors.
    - name: Apply the daemon config now
      ansible.builtin.meta: flush_handlers

    # Explicit, and explicitly allowed to fail the play. `docker compose up`
    # would pull these implicitly and report a tangle of service errors; here a
    # failure says which image and why, and stops with the machine in a state a
    # human can reason about. This is the condition the mirror decision was
    # accepted on — see docker_registry_mirrors above.
    - name: Pull the third-party images
      community.docker.docker_image_pull:
        name: "{{ item }}"
      loop: "{{ third_party_images }}"
      register: pulled
      failed_when: pulled is failed

    # ── Layout ────────────────────────────────────────────────────────────────

    - name: Create the stack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ mica_dir }}"
        - "{{ traefik_dir }}"

    # Owned by neither stack, on purpose — whichever came down last would take
    # the other's networking with it. Both compose files declare it external.
    - name: Create the shared traefik network
      community.docker.docker_network:
        name: traefik-network
        state: present

    # ── Traefik ───────────────────────────────────────────────────────────────

    # Shipped from the repo, like the Mica compose is shipped from the tag: the
    # node keeping its own copy is the drift that deploy.yml's header is about.
    #
    # ONE DIFFERENCE, and it matters during a rebuild: this comes from the
    # WORKING TREE, not from a tag. deploy.yml is handed its compose by
    # scripts/deploy-prod.sh via `git show <tag>:…` because a mis-versioned
    # compose once reached prod that way. Here the same guarantee costs a second
    # extraction path for a file that changes about once a year — so instead:
    # CHECK OUT THE RELEASE TAG BEFORE RUNNING THIS during a recovery. Written
    # down rather than enforced, on purpose, and that is a real (small) gap.
    - name: Ship the Traefik compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/traefik/docker-compose.yml"
        dest: "{{ traefik_dir }}/docker-compose.yml"
        mode: "0644"
      notify: Restart Traefik

    # TRAEFIK_BASIC_AUTH guards the dashboard route. A credential, so NOT in
    # host_vars — same rule deploy.yml enforces for the app — and it comes from
    # the environment of whoever runs this play.
    #
    # DELIBERATELY NOT BACKED UP, and the reasoning is worth keeping because the
    # first attempt (2026-08-29) got it wrong: it was made to fall back to
    # /data/mica/.env.secrets, which IS in the backup. That crossed a boundary
    # this repo is otherwise careful about — that file is the MICA stack's, read
    # by `docker compose --env-file`, whose `environment:` block is an explicit
    # allow-list; Traefik is a separate stack that predates Mica on the node.
    #
    # The rule that actually applies is narrower than "everything must be in git
    # or the backup": things whose loss is UNRECOVERABLE or SILENT must be. This
    # is neither. `htpasswd -nbB admin '<password>'` regenerates it in one
    # command, and losing it announces itself the moment somebody cannot log in.
    # A rebuilt node gets a new dashboard password, and that is the whole cost.
    - name: Decide the dashboard credential
      ansible.builtin.set_fact:
        traefik_basic_auth: "{{ lookup('env', 'TRAEFIK_BASIC_AUTH') | trim }}"

    # Rendering an empty one is fail-closed (the middleware then rejects every
    # login), which is the right default — but silent, so say it.
    - name: Say when the dashboard will have no working credential
      ansible.builtin.debug:
        msg: >-
          TRAEFIK_BASIC_AUTH is not set — the Traefik dashboard route will reject
          every login (fail-closed). Mica itself is unaffected. Generate one with
          `htpasswd -nbB admin '<password>'` and re-run with it in the environment.
      when: traefik_basic_auth | length == 0

    - name: Render the Traefik .env
      ansible.builtin.template:
        src: traefik-env.j2
        dest: "{{ traefik_dir }}/.env"
        mode: "0600"
      notify: Restart Traefik

    - name: Bring Traefik up
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_dir }}"
        state: present
        wait: true
        wait_timeout: 120

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

    - name: Restart Traefik
      community.docker.docker_compose_v2:
        project_src: "{{ traefik_dir }}"
        state: restarted
        wait: true
        wait_timeout: 120
