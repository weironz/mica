[package]
name = "mica-api-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
publish = false
description = "Mica REST payload types, shared by the API server and its Rust clients (CLI)"

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# Only the server reads these rows straight out of Postgres. Behind a feature so
# the CLI does not pull in a database driver to decode JSON.
sqlx = { workspace = true, optional = true }

[features]
sqlx = ["dep:sqlx"]
