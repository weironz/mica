[package]
name = "mica-board"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Mica infinite whiteboard, mind map, flowchart, draw.io import, orthogonal routing, and headless SVG engine"

[features]
default = []
crdt = ["dep:yrs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
percent-encoding = "2.3"
roxmltree = "0.20"
yrs = { version = "0.28.0", features = ["sync"], optional = true }
