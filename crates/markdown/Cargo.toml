[package]
name = "mica-markdown"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Forward the engine's rich-export feature: math → SVG, Mermaid → SVG.
render = ["mica-md/render"]

[dependencies]
mica-md = { path = "../md-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Property fuzz: import_markdown must never panic on untrusted input
# (tests/proptest_parse.rs).
proptest = "1"
