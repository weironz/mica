[package]
name = "mica-infra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
dotenvy.workspace = true
# OS CSPRNG for the self-minted JWT signing key (db.rs::ensure_jwt_secret).
rand_core.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `tests/jwt_secret_pg.rs` is async against a real Postgres. infra itself needs
# no runtime — it hands futures to whoever drives them — so tokio is a test-only
# dependency here.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
