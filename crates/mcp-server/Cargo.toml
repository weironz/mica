[package]
name = "mica-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"


[dependencies]
anyhow.workspace = true
# The authority on where a math run starts and ends (CLAUDE.md #2). The write
# guard must judge formulas by the same rules the parser does, not its own.
mica-markdown = { path = "../markdown" }
reqwest = { workspace = true, features = ["json"] }
# join_all, for the outline mode of mica_read_documents: no batch route exists
# for outlines, so the per-doc fetches are joined in bounded waves instead of
# awaited one at a time.
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
# The official Rust MCP SDK. `server` = build a server, `transport-io` = stdio,
# `macros` = the #[tool]/#[tool_router] attributes. Pinned at the crate level
# (not the workspace) since it's this binary's concern only.
rmcp = { version = "0.9", features = ["server", "transport-io", "macros"] }
# `uuid1`: tool-argument ids are `Uuid` (see args.rs), schema'd as a uuid string.
schemars = { version = "1", features = ["uuid1"] }
uuid.workspace = true
# MCP carries image bytes as base64 in an ImageContent block — that IS the wire
# format, so `mica_read_image` has to encode.
base64 = "0.22"

[dev-dependencies]
# The wire tests run a fake Mica API on a local TcpListener.
tokio = { workspace = true, features = ["net", "io-util"] }
