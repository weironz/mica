[package]
name = "mica-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
sqlite = ["mica-core/store", "mica-sync/sqlite"]

[dependencies]
chrono.workspace = true
mica-api-types = { path = "../api-types" }
mica-board = { path = "../mica-board" }
mica-core = { path = "../mica-core" }
mica-editor = { path = "../mica-editor" }
mica-md = { path = "../md-core" }
mica-sync = { path = "../mica-sync" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mica-core = { path = "../mica-core", features = ["store"] }
mica-sync = { path = "../mica-sync", features = ["sqlite"] }
dirs-next = "2"
rustls = { version = "0.23", default-features = false }
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }
webpki-roots = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
uuid = { version = "1.11", features = ["serde", "v4", "js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "CloseEvent",
  "Document",
  "DomException",
  "DomStringList",
  "Element",
  "ErrorEvent",
  "Event",
  "File",
  "FileList",
  "FileReader",
  "Headers",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbVersionChangeEvent",
  "Location",
  "MessageEvent",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "Response",
  "Storage",
  "Url",
  "WebSocket",
  "Window",
] }
