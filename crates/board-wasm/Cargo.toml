[package]
name = "mica-board-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "On-demand WebAssembly binding for mica-board (SVG export, mind map layout, orthogonal routing, draw.io import, 3-way merge)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mica-board = { path = "../mica-board" }
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
