name: Release

# Build & publish pure-Rust Mica release artifacts:
#   * Windows desktop installer (clients/mica_rust -> Mica-Setup-X.Y.Z.exe)
#   * mica-cli binaries (Windows / Linux static / optional macOS)
#   * Docker images (mica-api, mica-web pure-Rust WASM, mica-cli)
#   * Optional Linux .deb (clients/mica_rust -> Mica-X.Y.Z-linux-amd64.deb)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.14.12)'
        required: true
      source_sha:
        description: 'Optional commit SHA to build (for resuming an already-tagged draft release)'
        type: string
      publish:
        description: 'Publish to GitHub release (off = dry-run)'
        type: boolean
        default: false
      build_macos_cli:
        description: 'Also build macOS CLI'
        type: boolean
        default: false
      build_linux_deb:
        description: 'Also build the Linux .deb'
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_sha:
        description: 'Commit prepared by Ship'
        type: string
      previous_tag:
        description: 'Latest release Ship is replacing'
        type: string
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      build_macos_cli:
        type: boolean
        default: false
      build_linux_deb:
        type: boolean
        default: false
      web_bundle_artifact:
        description: 'Prebuilt deploy/web artifact name uploaded by CI for the same SHA'
        type: string
        default: ''
      server_bins_artifact:
        description: 'Prebuilt glibc-2.36 api+cli binaries artifact uploaded by CI for the same SHA'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.ver.outputs.sha }}
      tag: ${{ steps.ver.outputs.tag }}
      cli-matrix: ${{ steps.cli-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Resolve CLI runners
        id: cli-matrix
        env:
          BUILD_MACOS_CLI: ${{ inputs.build_macos_cli }}
        run: |
          python3 scripts/test-release-cli-matrix.py
          python3 scripts/release-cli-matrix.py >> "$GITHUB_OUTPUT"
      - name: Resolve version
        id: ver
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          v=$(bash scripts/release-version.sh "$RELEASE_VERSION_INPUT")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse HEAD)
          if [[ "$PUBLISH" == true ]] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_sha=$(git ls-remote origin "refs/tags/v$v^{}")
            [[ -n "$tag_sha" ]] || tag_sha=$(git ls-remote --exit-code origin "refs/tags/v$v")
            [[ "${tag_sha%%$'\t'*}" == "$sha" ]] || { echo "::error::v$v does not point at $sha"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: true

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Test installer completion gate
        shell: pwsh
        run: ./scripts/test-installer-wait.ps1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/mica_rust
          shared-key: mica-rust-win-release
          cache-on-failure: true
      - name: Build pure-Rust Windows desktop binary
        run: cargo build --manifest-path clients/mica_rust/Cargo.toml --bin mica-rust --release --locked
      - name: Install Inno Setup (skip if preinstalled)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          } else {
            Write-Host "Inno Setup 6 already preinstalled"
          }
      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.draft.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "clients\mica_rust\installer\mica.iss"
      - name: Write installer checksum
        shell: bash
        working-directory: clients/mica_rust/installer/Output
        run: sha256sum Mica-Setup-*.exe > sha256-windows-installer.txt && cat sha256-windows-installer.txt
      - uses: actions/upload-artifact@v6
        with:
          name: Mica-Setup-${{ needs.draft.outputs.version }}
          path: |
            clients/mica_rust/installer/Output/Mica-Setup-${{ needs.draft.outputs.version }}.exe
            clients/mica_rust/installer/Output/sha256-windows-installer.txt
          if-no-files-found: error
      - name: Publish installer to draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.draft.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            clients/mica_rust/installer/Output/Mica-Setup-${{ needs.draft.outputs.version }}.exe
            clients/mica_rust/installer/Output/sha256-windows-installer.txt

  cli:
    needs: draft
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.draft.outputs.cli-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Install musl tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build mica-cli
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --locked -p mica-cli --release --target "${{ matrix.target }}"
            mkdir -p out
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "out/mica-cli-${{ needs.draft.outputs.version }}-${{ matrix.suffix }}"
          else
            cargo build --locked -p mica-cli --release
            mkdir -p out
            cp "target/release/${{ matrix.bin }}" "out/mica-cli-${{ needs.draft.outputs.version }}-${{ matrix.suffix }}"
          fi
      - name: Write checksum manifest
        shell: bash
        working-directory: out
        run: sha256sum mica-cli-* > "sha256-${{ matrix.osname }}.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: mica-cli-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error
      - name: Attach CLI binary + checksums to draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.draft.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: out/*

  images:
    needs: draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - img: api
            web: false
          - img: web
            web: true
          - img: cli
            web: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Download prebuilt pure-Rust Web bundle from CI
        if: ${{ matrix.web && inputs.web_bundle_artifact != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.web_bundle_artifact }}
          path: deploy/web
      - uses: ./.github/actions/setup-rust
        if: ${{ matrix.web && inputs.web_bundle_artifact == '' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ matrix.web && inputs.web_bundle_artifact == '' }}
        with:
          workspaces: clients/mica_rust
          key: mica-rust-client
      - name: Build pure-Rust WebAssembly bundle (standalone fallback)
        if: ${{ matrix.web && inputs.web_bundle_artifact == '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli clang
          rustup target add wasm32-unknown-unknown
          bash scripts/install-web-tools.sh
          bash scripts/test-web-csp-hashes.sh
          bash scripts/build-web-rust.sh
      - name: Download prebuilt glibc-2.36 server binaries from CI
        if: ${{ !matrix.web && inputs.server_bins_artifact != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.server_bins_artifact }}
          path: deploy/prebuilt
      - uses: docker/setup-buildx-action@v3
      - name: Login to Aliyun ACR
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Login to Docker Hub
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push mica-${{ matrix.img }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.img }}
          target: ${{ (!matrix.web && inputs.server_bins_artifact != '') && 'runtime-prebuilt' || '' }}
          provenance: false
          sbom: false
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
          tags: |
            registry.cn-shenzhen.aliyuncs.com/willspace/mica-${{ matrix.img }}:${{ needs.draft.outputs.tag }}
            willdockerhub/mica-${{ matrix.img }}:${{ needs.draft.outputs.tag }}

  linux-deb:
    needs: draft
    if: ${{ inputs.build_linux_deb || vars.MICA_BUILD_LINUX_DEB == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Build pure-Rust Linux .deb
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libxkbcommon-dev dpkg-dev
          bash scripts/build-linux-deb.sh "${{ needs.draft.outputs.version }}" out
      - name: Write checksum manifest
        working-directory: out
        run: sha256sum Mica-*.deb > sha256-linux-desktop.txt
      - uses: actions/upload-artifact@v6
        with:
          name: mica-linux-deb
          path: |
            out/Mica-*.deb
            out/sha256-linux-desktop.txt
          if-no-files-found: error
      - name: Attach to draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.draft.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            out/Mica-*.deb
            out/sha256-linux-desktop.txt

  publish:
    needs: [draft, windows, cli, images, linux-deb]
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
    runs-on: ubuntu-latest
    concurrency:
      group: mica-release-publish
      cancel-in-progress: false
    steps:
      - name: Verify assets, generate release notes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_TAG" ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [[ "$latest" != "$PREVIOUS_TAG" && "$latest" != "$RELEASE_TAG" ]]; then
              echo "::error::Latest changed to $latest; refusing to publish $RELEASE_TAG as latest"
              exit 1
            fi
          fi

          assets_tsv=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, (.digest // "")] | @tsv')
          assets=$(cut -f1 <<<"$assets_tsv")

          dl=$(mktemp -d)
          trap 'rm -rf -- "$dl"' EXIT

          manifest_for_asset() {
            case "$1" in
              Mica-*-linux-*.deb) echo sha256-linux-desktop.txt ;;
              *-linux-*) echo sha256-linux.txt ;;
              *-macos-*) echo sha256-macos.txt ;;
              Mica-Setup-*) echo sha256-windows-installer.txt ;;
              *-windows-*) echo sha256-windows.txt ;;
              *) return 1 ;;
            esac
          }

          verify_asset() {
            local asset=$1 manifest mf listed want actual
            manifest=$(manifest_for_asset "$asset")
            grep -qxF "$manifest" <<<"$assets" \
              || { echo "::error::Missing checksum manifest $manifest for $asset"; exit 1; }
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$manifest" --dir "$dl" --clobber >/dev/null
            mf="$dl/$manifest"
            listed=$(awk -v n="$asset" '$2 == n || $2 == "*"n { print $1 }' "$mf")
            [ -n "$listed" ] \
              || { echo "::error::$manifest does not list $asset"; exit 1; }
            want=$(awk -F'\t' -v n="$asset" '$1 == n { print $2 }' <<<"$assets_tsv" | sed 's/^sha256://')
            if [ -n "$want" ]; then
              [ "${listed,,}" = "${want,,}" ] \
                || { echo "::error::$asset in $manifest hashes to $listed, GitHub digest is $want"; exit 1; }
            else
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$dl" --clobber >/dev/null
              actual=$(sha256sum "$dl/$asset" | cut -d' ' -f1)
              [ "${listed,,}" = "$actual" ] \
                || { echo "::error::$asset in $manifest hashes to $listed, downloaded asset is $actual"; exit 1; }
            fi
            echo "Verified $asset against $manifest ($listed)"
          }

          for asset in \
            "Mica-Setup-${VERSION}.exe" \
            "mica-cli-${VERSION}-windows-x64.exe" \
            "mica-cli-${VERSION}-linux-x64"; do
            grep -qxF "$asset" <<<"$assets" \
              || { echo "::error::Required asset missing from draft release: $asset"; exit 1; }
            verify_asset "$asset"
          done
          for opt in \
            "mica-cli-${VERSION}-macos-arm64" \
            "Mica-${VERSION}-linux-amd64.deb"; do
            if grep -qxF "$opt" <<<"$assets"; then
              verify_asset "$opt"
            fi
          done

          existing_body=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')
          if [ -z "${existing_body//[$' \t\r\n']/}" ]; then
            notes_file="$dl/release-notes.md"
            if [ -n "$PREVIOUS_TAG" ]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f "tag_name=$RELEASE_TAG" -f "previous_tag_name=$PREVIOUS_TAG" --jq .body > "$notes_file"
              if ! grep -q '^## ' "$notes_file"; then
                commits_md=$(gh api "repos/$GITHUB_REPOSITORY/compare/${PREVIOUS_TAG}...${RELEASE_TAG}" \
                  --jq '.commits[] | select((.commit.message | startswith("chore(release):")) | not) | "- " + (.commit.message | split("\n")[0]) + " (`" + (.sha[0:7]) + "`)"' \
                  2>/dev/null || true)
                if [ -n "$commits_md" ]; then
                  prev_notes=$(cat "$notes_file")
                  {
                    printf '## Changes\n\n%s\n\n%s\n' "$commits_md" "$prev_notes"
                  } > "$notes_file"
                fi
              fi
            else
              gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f "tag_name=$RELEASE_TAG" --jq .body > "$notes_file"
            fi
            printf '\n---\n> **Supported platforms (100%% pure Rust):** Windows installer (`Mica-Setup-*.exe`), Web (`mica-web` image), `mica-cli` (`windows-x64`, `linux-x64`, optional `macos-arm64`), and optional Linux `.deb`. Android APK builds are retired (existing `0.14.x` Android APKs remain usable without new updates).\n' >> "$notes_file"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes-file "$notes_file"
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

          published_latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [ "$published_latest" = "$RELEASE_TAG" ] \
            || { echo "::error::/releases/latest is $published_latest, expected $RELEASE_TAG"; exit 1; }
