name: Deploy

# Manual only. There is no `on: push` here on purpose — "which version is live"
# stays a decision somebody makes, not a side effect of merging.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version WITHOUT the leading v, e.g. 0.13.27'
        required: true
      check:
        # A normal run rehearses too, then deploys — see the rehearsal step.
        # This makes it STOP after the rehearsal.
        description: 'Rehearse only — stop after --check --diff, change nothing'
        type: boolean
        default: false

# Two deploys at once would race on the node's .env (both rewrite MICA_VERSION).
# Queue instead of cancelling: a half-applied deploy is worse than a slow one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Kept for the deployment history / audit trail on the repo, NOT as a gate:
    # this environment deliberately carries no required reviewer.
    #
    # `workflow_dispatch` with no `on: push` already means a person decides to
    # ship — an approval step on top would be a second confirmation of the same
    # decision, which for one maintainer is friction rather than safety. Add
    # reviewers here if that ever stops being true (Settings → Environments).
    environment:
      name: production
      url: https://mica.cloudcele.com

    steps:
      # The DEFAULT BRANCH, deliberately — not `ref: v${{ inputs.version }}`.
      #
      # The deploy machinery and the application version are independent
      # timelines. Checking out the tag was the first draft here, and it means
      # every version published BEFORE this machinery existed becomes
      # undeployable: v0.13.27 has no ansible/ and no scripts/deploy-prod.sh, so
      # the job dies before it starts. Rolling back to an older release is
      # exactly when you least want the deploy path to be missing.
      #
      # The compose still comes from the tag — scripts/deploy-prod.sh fetches it
      # and reads it with `git show v<version>:deploy/docker-compose.yml`. So
      # "which compose" follows the release while "how to deploy" follows main,
      # which is the split that was wanted all along.
      #
      # fetch-depth: 0 because that `git show` needs the tag's tree.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject anything that is not X.Y.Z
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "version must be X.Y.Z"; exit 1; }

      - name: Install ansible
        run: |
          pipx install --include-deps ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Set up the deploy key
        env:
          # A key with a SHELL on the node, as root. That is a deliberate
          # loosening: the old key was pinned to /usr/local/sbin/mica-deploy via
          # `restrict,command=` in authorized_keys, so leaked it could only move
          # prod between published versions — no shell, no .env, no database.
          # Ansible pushes modules to the host and executes them, so it cannot
          # work behind a pinned command; adopting it means giving that up.
          #
          # The trade was made with eyes open (docs/cd-plan.md §4): this same CI
          # already holds registry push credentials, so a compromised CI could
          # publish a malicious image that the node would pull and run under the
          # old fence too. The fence closed one door in a room with another door
          # standing open — and it cost a working deploy path, see below.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -o pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, not ssh-keyscan'd at runtime: scanning now would trust
          # whatever answers, which is not verification.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # ALWAYS, not just when `check` is on (2026-08-27).
      #
      # `check` used to be the whole rehearsal: `docs/release.md` step 4 told you
      # to dispatch once with it and again without, and nothing enforced the
      # first one. A step you can forget is not a gate — it is a habit with good
      # documentation, and the release it protects is exactly the moment people
      # are in a hurry.
      #
      # It costs ~35 s of playbook against the node and buys the failures worth
      # catching before anything moves: host unreachable, a data service not
      # healthy, the pre-migration restore point unwritable. `check` now means
      # "rehearse ONLY" rather than "rehearse INSTEAD".
      #
      # `--check --diff` is not a skip: the docker steps are community.docker
      # native modules, so check mode runs that same code. And "changed" in the
      # output is the POINT, not a failure — it is the diff of what the real run
      # will do. Only an error stops the job.
      - name: Rehearse against the node — changes nothing
        run: bash scripts/deploy-prod.sh '${{ inputs.version }}' --check --diff

      - name: Deploy
        if: ${{ !inputs.check }}
        run: |
          # What this replaces, and why it had to go:
          #
          #   CI used to send the sha256 of docker-compose.yml AT THE TAG, and
          #   the node refused unless its own copy matched. Which meant every
          #   compose change — a quota, a feature flag, a backup variable — made
          #   the next deploy FAIL until somebody ran the laptop fallback by
          #   hand. Config changes are a large share of all deploys, so the
          #   fallback quietly became the main path: a main path nobody
          #   designed, tested, or could run from CI.
          #
          #   The playbook ships the file from the tag instead. Drift cannot
          #   exist, because the node's compose is by construction the one this
          #   version was released with. There is nothing left to compare.
          bash scripts/deploy-prod.sh '${{ inputs.version }}'

      # deploy-prod.sh already runs verify-prod on success. Nothing more to
      # assert after a rehearsal: prod still reports the PREVIOUS version, and a
      # check that "passes" by measuring the old state is worse than no check.
      - name: Note that nothing was deployed
        if: ${{ inputs.check }}
        run: echo "::notice::rehearsal only — prod was not changed"
