name: Runner probe

# Reports what each self-hosted runner actually is — OS, labels, and the tools
# the other workflows assume — so `runs-on:` can be pointed at real machines
# instead of guessed labels (2026-10-20: the hosted quota ran out and two
# self-hosted runners were added). Manual only, like everything else here.
on:
  workflow_dispatch:

jobs:
  probe:
    # Two copies so that, with both runners idle, each one picks up a job.
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Who am I
        shell: bash
        run: |
          echo "runner:  $RUNNER_NAME  os=$RUNNER_OS  arch=$RUNNER_ARCH"
          echo "workdir: $RUNNER_WORKSPACE"
          uname -a || true
          cat /etc/os-release 2>/dev/null | head -2 || true
          for t in git bash docker cargo rustc flutter dart ansible-playbook python3 node gh iscc just psql; do
            if command -v "$t" >/dev/null 2>&1; then printf '%-17s %s\n' "$t" "$(command -v "$t")"; else printf '%-17s MISSING\n' "$t"; fi
          done
          docker info --format 'docker server {{.ServerVersion}}' 2>&1 | head -1 || true
          cargo --version 2>/dev/null || true
          flutter --version 2>/dev/null | head -1 || true
          df -h . | tail -1 || true
