# Browser-only Flutter suites (real IndexedDB, Web Locks, DOM clipboard …) as
# release acceptance, recorded as the commit status `mica/browser-tests` on the
# commit they ran against.
#
# docs/ops/release.md lists these suites as required before a release goes
# public, but nothing enforced it: release-check does not run them, and the
# Windows Flutter test server 404s its own CanvasKit (#181), so a Windows
# release machine cannot run them at all. Now `release-publish` (local) and the
# Release workflow's `publish` job both require that status on the release
# commit.
#
# Two ways in:
#   - Release (hosted) calls this for its own commit, and `publish` waits on it.
#   - `just ship` on a Windows machine dispatches it for the tag right after the
#     push, keeps building the installer meanwhile, and waits for the status
#     before publishing. Any Linux/macOS machine can produce the same status
#     instead: `just browser-tests-report X.Y.Z`.
name: Browser tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to test (e.g. v0.14.9)"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  browser:
    name: Browser-only Flutter suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: md-wasm-release
      - uses: ./.github/actions/setup-flutter
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # The runner image ships Google Chrome; a missing browser must fail,
      # never skip (scripts/browser-tests.sh refuses without one).
      - name: Browser-only Flutter suites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHROME_EXECUTABLE="$(command -v google-chrome || command -v chromium || true)"
          test -x "$CHROME_EXECUTABLE"
          export CHROME_EXECUTABLE
          bash scripts/browser-tests.sh --report-status
