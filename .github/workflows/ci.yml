name: CI

# 100% Fullstack Rust CI: root workspace (L1+L2+server+CLI+MCP) +
# pure-Rust L3 client (`clients/mica_rust` desktop & WebAssembly).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Job selection: full runs everything; diff runs only groups affected by base_ref..HEAD'
        type: choice
        default: full
        options: [full, diff]
      base_ref:
        description: 'Git ref for diff scope (ignored when scope=full)'
        default: origin/main
  workflow_call:
    inputs:
      source_sha:
        description: 'Commit to test (defaults to github.sha)'
        type: string
      scope:
        description: 'Job selection: full or diff'
        type: string
        default: full
      base_ref:
        description: 'Git ref for diff scope'
        type: string
        default: origin/main

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  rustsec:
    name: RustSec (both lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Audit root and pure-Rust client lockfiles
        run: bash scripts/check-rust-audit.sh

  paths:
    name: Scope (affected job groups)
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      client: ${{ steps.groups.outputs.client }}
      container: ${{ steps.groups.outputs.container }}
      mcp: ${{ steps.groups.outputs.mcp }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve job groups
        id: groups
        env:
          SCOPE: ${{ inputs.scope || 'full' }}
          BASE_REF: ${{ inputs.base_ref || 'origin/main' }}
        run: |
          if [ "$SCOPE" = "diff" ]; then
            selected=$(bash scripts/ci-paths-for-scope.sh "$BASE_REF" HEAD)
          else
            selected=$(bash scripts/ci-paths-for-scope.sh)
          fi
          for job in rust client container mcp; do
            if grep -qx "$job" <<<"$selected"; then
              echo "$job=true" >> "$GITHUB_OUTPUT"
            else
              echo "$job=false" >> "$GITHUB_OUTPUT"
            fi
          done

  structure:
    name: Structure & Hygiene (size, ignored-sources, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Check ignored source files
        run: bash scripts/check-ignored-sources.sh
      - name: Check SQL migrations
        run: |
          bash scripts/check-migration-tracking.sh
          bash scripts/test-migration-tracking.sh
      - name: Check Rust file-size gate
        run: bash scripts/check-file-size.sh

  rust:
    name: Rust Workspace (build + clippy + Postgres tests + SQLite store)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.rust == 'true'
    needs: paths
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mica
          POSTGRES_PASSWORD: mica
          POSTGRES_DB: mica
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mica"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mica:mica@127.0.0.1:5432/mica
      MICA_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt (deny drift)
        run: cargo fmt --all --check
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Apply migrations
        run: cargo run -q -p mica-infra --example apply_migrations
      - name: Test workspace (Postgres-backed)
        run: |
          source scripts/lib-local.sh && source scripts/lib-receipt.sh
          cargo_receipt 500 cargo test --workspace --locked
      - name: Test mica-core gated SQLite store
        run: |
          source scripts/lib-local.sh && source scripts/lib-receipt.sh
          cargo_receipt 1 cargo test -p mica-core --features store --locked
      - name: Run shipped mica-md examples
        run: |
          for e in parse_and_serialize render_html table_cells inline; do
            cargo run -q -p mica-md --example "$e" >/dev/null
          done

  client:
    name: Pure-Rust Client (clients/mica_rust desktop + Web WASM + E2E)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.client == 'true'
    needs: paths
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Install Linux GUI & wasm32 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli clang libgtk-3-dev libwebkit2gtk-4.1-dev libxkbcommon-dev
          rustup target add wasm32-unknown-unknown
          bash scripts/install-web-tools.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/mica_rust
          key: mica-rust-client
      - name: Clippy clients/mica_rust (deny warnings)
        run: cargo clippy --manifest-path clients/mica_rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test clients/mica_rust (unit + storage/sync + headless E2E)
        run: |
          source scripts/lib-local.sh && source scripts/lib-receipt.sh
          cargo_receipt 15 cargo test --manifest-path clients/mica_rust/Cargo.toml --locked
      - name: Build native desktop binary
        run: cargo build --manifest-path clients/mica_rust/Cargo.toml --bin mica-rust --locked
      - name: Build pure-Rust WebAssembly bundle
        run: |
          bash scripts/test-web-csp-hashes.sh
          bash scripts/build-web-rust.sh

  mcp:
    name: MCP (mica-cli mcp conformance)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.mcp == 'true'
    needs: paths
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Build mica-cli
        run: cargo build --locked -p mica-cli
      - name: Verify MCP tools/list over stdio
        run: |
          python3 - <<'EOF'
          import json, subprocess
          p = subprocess.Popen(
              ["target/debug/mica-cli", "mcp"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True
          )
          req = {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1.0"}}}
          p.stdin.write(json.dumps(req) + "\n")
          p.stdin.flush()
          init_resp = json.loads(p.stdout.readline())
          assert "result" in init_resp, init_resp
          p.stdin.write(json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}) + "\n")
          p.stdin.flush()
          list_resp = json.loads(p.stdout.readline())
          tools = list_resp["result"]["tools"]
          assert len(tools) >= 5, f"expected >= 5 tools, got {len(tools)}"
          p.terminate()
          print(f"{len(tools)} MCP tools verified")
          EOF

  container:
    name: Container (Dockerfile.api + Dockerfile.web + Dockerfile.cli)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.container == 'true'
    needs: paths
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Build pure-Rust Web bundle for Dockerfile.web
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli clang
          rustup target add wasm32-unknown-unknown
          bash scripts/install-web-tools.sh
          bash scripts/test-web-csp-hashes.sh
          bash scripts/build-web-rust.sh
      - name: Build Docker images
        run: |
          docker build -f deploy/Dockerfile.web -t mica-web:ci .
          docker build -f deploy/Dockerfile.cli -t mica-cli:ci .
          docker build -f deploy/Dockerfile.api -t mica-api:ci .
