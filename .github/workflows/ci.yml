name: CI

# 100% Fullstack Rust CI: root workspace (L1+L2+server+CLI+MCP) +
# pure-Rust L3 client (`clients/mica_rust` desktop & WebAssembly).

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Job selection: full runs everything; diff runs only groups affected by base_ref..HEAD'
        type: choice
        default: full
        options: [full, diff]
      base_ref:
        description: 'Git ref for diff scope (ignored when scope=full)'
        default: origin/main
  workflow_call:
    inputs:
      source_sha:
        description: 'Commit to test (defaults to github.sha)'
        type: string
      scope:
        description: 'Job selection: full or diff'
        type: string
        default: full
      base_ref:
        description: 'Git ref for diff scope'
        type: string
        default: origin/main
    outputs:
      web_bundle_artifact:
        description: 'Uploaded deploy/web artifact name when client job ran'
        value: ${{ jobs.client.outputs.web_bundle_artifact }}
      server_bins_artifact:
        description: 'Uploaded glibc-2.36 mica-api-server + mica-cli artifact name when server-bins job ran'
        value: ${{ jobs.server-bins.outputs.server_bins_artifact }}

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  rustsec:
    name: RustSec (both lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Install pinned prebuilt cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.23.0
      - name: Audit root and pure-Rust client lockfiles
        run: bash scripts/check-rust-audit.sh

  paths:
    name: Scope (affected job groups)
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.groups.outputs.rust }}
      client: ${{ steps.groups.outputs.client }}
      container: ${{ steps.groups.outputs.container }}
      mcp: ${{ steps.groups.outputs.mcp }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve job groups
        id: groups
        env:
          SCOPE: ${{ inputs.scope || 'full' }}
          BASE_REF: ${{ inputs.base_ref || 'origin/main' }}
        run: |
          if [ "$SCOPE" = "diff" ]; then
            selected=$(bash scripts/ci-paths-for-scope.sh "$BASE_REF" HEAD)
          else
            selected=$(bash scripts/ci-paths-for-scope.sh)
          fi
          for job in rust client container mcp; do
            if grep -qx "$job" <<<"$selected"; then
              echo "$job=true" >> "$GITHUB_OUTPUT"
            else
              echo "$job=false" >> "$GITHUB_OUTPUT"
            fi
          done

  structure:
    name: Structure & Hygiene (size, ignored-sources, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Validate GitHub workflow YAMLs
        run: bash scripts/test-release-workflow.sh
      - name: Check ignored source files
        run: bash scripts/check-ignored-sources.sh
      - name: Check SQL migrations
        run: |
          bash scripts/check-migration-tracking.sh
          bash scripts/test-migration-tracking.sh
      - name: Check Rust file-size gate
        run: bash scripts/check-file-size.sh
      - uses: ./.github/actions/setup-rust
      - name: rustfmt (deny drift)
        run: cargo fmt --all --check

  rust:
    name: Rust Workspace (build + clippy + Postgres tests + SQLite store)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.rust == 'true'
    needs: [paths, structure]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mica
          POSTGRES_PASSWORD: mica
          POSTGRES_DB: mica
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mica"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mica:mica@127.0.0.1:5432/mica
      MICA_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Apply migrations
        run: cargo run -q -p mica-infra --example apply_migrations
      - name: Test workspace (Postgres-backed)
        run: |
          source scripts/lib-local.sh && source scripts/lib-receipt.sh
          cargo_receipt 550 cargo test --workspace --locked
          cargo_receipt 70 cargo test -p mica-editor --locked
          cargo_receipt 30 cargo test -p mica-client --locked
      - name: Test mica-core gated SQLite store
        run: |
          source scripts/lib-local.sh && source scripts/lib-receipt.sh
          cargo_receipt 1 cargo test -p mica-core --features store --locked
      - name: Run shipped mica-md examples
        run: |
          for e in parse_and_serialize render_html table_cells inline; do
            cargo run -q -p mica-md --example "$e" >/dev/null
          done

  client:
    name: Pure-Rust Client (clients/mica_rust desktop + Web WASM + E2E)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.client == 'true'
    needs: [paths, structure]
    outputs:
      web_bundle_artifact: ${{ steps.web-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Cache pinned WebAssembly tools (wasm-bindgen + binaryen)
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: ${{ runner.os }}-web-tools-bin123-${{ hashFiles('clients/mica_rust/Cargo.lock') }}
      - name: Install Linux GUI & wasm32 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli clang pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libxkbcommon-dev
          rustup target add wasm32-unknown-unknown
          bash scripts/install-web-tools.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/mica_rust
          key: mica-rust-client
      - name: Clippy clients/mica_rust (deny warnings)
        run: cargo clippy --manifest-path clients/mica_rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test clients/mica_rust (unit + storage/sync + headless E2E)
        run: |
          source scripts/lib-local.sh && source scripts/lib-receipt.sh
          cargo_receipt 110 cargo test --manifest-path clients/mica_rust/Cargo.toml --locked
      - name: Build pure-Rust WebAssembly bundle
        run: |
          bash scripts/test-web-csp-hashes.sh
          bash scripts/build-web-rust.sh
      - name: Record web bundle artifact name
        id: web-artifact
        run: echo "name=web-bundle-${{ inputs.source_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.web-artifact.outputs.name }}
          path: deploy/web
          retention-days: 1
          if-no-files-found: error

  mcp:
    name: MCP (official inspector against mica-cli mcp)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.mcp == 'true'
    needs: [paths, structure]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build mica-cli
        run: cargo build --locked -p mica-cli
      - name: tools/list must survive a conforming client
        env:
          MICA_API_BASE_URL: https://mica.invalid
          MICA_PAT: dummy-not-used-for-handshake
        run: |
          set -euo pipefail
          npx -y @modelcontextprotocol/inspector@1 --cli \
            ./target/debug/mica-cli mcp --method tools/list > tools.json
          python3 - <<'EOF'
          import json
          tools = json.load(open("tools.json"))["tools"]
          assert tools, "the inspector returned no tools"
          for t in tools:
              assert t["inputSchema"].get("type") == "object", t["name"]
              out = t.get("outputSchema")
              assert out is None or out.get("type") == "object", (
                  f"{t['name']}: outputSchema must be an object schema or absent"
              )
          print(f"{len(tools)} tools accepted by the official client")
          EOF

  server-bins:
    name: Server Binaries (glibc-2.36 mica-api-server + mica-cli)
    runs-on: ubuntu-latest
    if: needs.paths.outputs.container == 'true'
    needs: [paths, structure]
    outputs:
      server_bins_artifact: ${{ steps.bins-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Cache bookworm Cargo build for mica-api-server + mica-cli
        uses: actions/cache@v5
        with:
          path: |
            .ci-bookworm-cache/cargo/registry/index
            .ci-bookworm-cache/cargo/registry/cache
            .ci-bookworm-cache/cargo/git/db
            .ci-bookworm-cache/target
          key: ${{ runner.os }}-bookworm-bins-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bookworm-bins-
      - name: Build glibc-2.36 mica-api-server + mica-cli in pinned bookworm builder
        run: |
          set -euo pipefail
          sh scripts/check-migration-bytes.sh
          rust_pin=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          builder_img="rust:${rust_pin%.*}-slim-bookworm"
          mkdir -p .ci-bookworm-cache/cargo .ci-bookworm-cache/target deploy/prebuilt
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/cargo \
            -e CARGO_TARGET_DIR=/target \
            -v "$PWD:/src" \
            -v "$PWD/.ci-bookworm-cache/cargo:/cargo" \
            -v "$PWD/.ci-bookworm-cache/target:/target" \
            -w /src \
            "$builder_img" \
            cargo build --locked --release -p mica-api-server -p mica-cli
          cp .ci-bookworm-cache/target/release/mica-api-server deploy/prebuilt/mica-api-server
          cp .ci-bookworm-cache/target/release/mica-cli deploy/prebuilt/mica-cli
          # Trim huge final binaries & incremental scratch from cache before saving.
          rm -rf .ci-bookworm-cache/target/release/incremental .ci-bookworm-cache/target/release/mica-api-server .ci-bookworm-cache/target/release/mica-cli
      - name: Record server binaries artifact name
        id: bins-artifact
        run: echo "name=server-bins-${{ inputs.source_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.bins-artifact.outputs.name }}
          path: deploy/prebuilt
          retention-days: 1
          if-no-files-found: error

  container:
    name: Container (Dockerfile.api + Dockerfile.web + Dockerfile.cli)
    runs-on: ubuntu-latest
    needs: [paths, client, server-bins]
    if: ${{ !failure() && !cancelled() && needs.paths.outputs.container == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Download prebuilt pure-Rust Web bundle from client job
        if: ${{ needs.client.result == 'success' && needs.client.outputs.web_bundle_artifact != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.client.outputs.web_bundle_artifact }}
          path: deploy/web
      - uses: ./.github/actions/setup-rust
        if: ${{ needs.client.result != 'success' || needs.client.outputs.web_bundle_artifact == '' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ needs.client.result != 'success' || needs.client.outputs.web_bundle_artifact == '' }}
        with:
          workspaces: clients/mica_rust
          key: mica-rust-client
      - name: Build pure-Rust Web bundle fallback (when client job was skipped)
        if: ${{ needs.client.result != 'success' || needs.client.outputs.web_bundle_artifact == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli clang
          rustup target add wasm32-unknown-unknown
          bash scripts/install-web-tools.sh
          bash scripts/test-web-csp-hashes.sh
          bash scripts/build-web-rust.sh
      - name: Download prebuilt glibc-2.36 server binaries from server-bins job
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.server-bins.outputs.server_bins_artifact }}
          path: deploy/prebuilt
      - name: Build Docker images
        run: |
          docker build -f deploy/Dockerfile.web -t mica-web:ci .
          docker build -f deploy/Dockerfile.cli --target runtime-prebuilt -t mica-cli:ci .
          docker build -f deploy/Dockerfile.api --target runtime-prebuilt -t mica-api:ci .
      - name: Cache pinned Playwright Chromium browser
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json', 'e2e/package-lock.json') }}
      - name: Boot CI container stack & run Playwright pure-Rust Web E2E
        run: |
          bash scripts/ci-container-stack.sh up
          bash scripts/web-entry-cache-check.sh http://127.0.0.1
          (cd e2e && npm ci --no-audit --no-fund)
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            (cd e2e && npx playwright install chromium --with-deps)
          else
            (cd e2e && npx playwright install-deps chromium)
          fi
          node e2e/web_e2e.mjs --base http://127.0.0.1 --email e2e@mica.test --password E2ePassword123! --register
      - name: Dump CI stack logs on failure
        if: failure()
        run: bash scripts/ci-container-stack.sh logs 120 || true
      - name: Tear down CI container stack
        if: always()
        run: bash scripts/ci-container-stack.sh down || true
