name: CI

# Fast pre-merge checks: compile the Rust backend workspace + run its pure
# (no-database) crate tests, and run the Flutter Dart unit tests. Every command
# here was verified green locally (2026-07-08): cargo test on the pure crates
# (~45 tests) and `flutter test test` (206 tests).
#
# The Windows integration_test suite runs in flutter-integration.yml (a real
# Windows runner builds the native FFI and drives the app). Only its OFFLINE
# subset runs there; four files still need the whole dev stack (postgres +
# rustfs + api-server) and are excluded, listed with reasons in that file's
# header.
#
# 2026-07-21 audit (docs/code-review-2026-07-20.md) found 167 tests that never
# ran here. Three causes, all fixed below:
#   - app-core / infra were simply absent from `-p`, which alone silenced SEVEN
#     pure-Rust, zero-dependency tests — including every bit of coverage for the
#     root-erasure read path (the 2026-07-19 incident).
#   - mica-core's `store` module is behind a non-default feature, so its 24
#     SQLite migration tests were never even COMPILED.
#   - sync_pg.rs skipped itself without a database. It now fails instead, so
#     this job must actually provision one.

on:
  push:
    branches: [main]
    # A markdown-only commit cannot break a build. Two docs commits on 07-28
    # each started the full matrix; on the Windows integration workflow that is
    # 14 minutes of runner time for a paragraph.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

# Pushing several commits in a row (five within an hour on 07-28) left four
# superseded runs burning runners for a verdict nobody would read. The newest
# commit's result is the one that matters; a broken commit in the middle is
# still caught, because the fix is a later commit with its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build + lint + tests)
    runs-on: ubuntu-latest

    # sync_pg.rs asserts against real SQL (a conditional UPDATE IS the
    # concurrency guard); a mock would test nothing. Cheap here — one container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mica
          POSTGRES_PASSWORD: mica
          POSTGRES_DB: mica
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mica"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://mica:mica@127.0.0.1:5432/mica

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # rust-cache, NOT a hand-rolled actions/cache of `target`: caching the
      # whole target dir stored ~2.5GB PER ENTRY (and entries are scoped per
      # ref, so every tag push doubled it) — 5.1GB of the repo's 10GB cache
      # budget, blowing it past the limit and evicting everyone else's caches.
      # rust-cache prunes the workspace's own artifacts (they change every
      # commit and are worthless to restore) and keeps only deps: the cli job
      # using it sits at ~115MB, 20x smaller, for the same speedup.
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      # rust-toolchain.toml pins `stable` (+ rustfmt, clippy); rustup honors it.
      # sqlx uses the runtime query API (not compile-time macros), so the
      # workspace builds without a live database.
      - name: Build workspace
        run: cargo build --workspace

      # `invisible_characters` is deny-by-default and fired on the `&shy;` entity
      # in crates/markdown, which ABORTED clippy on the first crate — so the
      # other eight had never been linted at all. With that one false positive
      # allowed at its source, the whole workspace is clean, which is why this
      # can start life at -D warnings instead of as an advisory.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Plain SQL, applied in order. sqlx-cli would have to be compiled first
      # (minutes); psql ships on the runner. The tests do not read the
      # _sqlx_migrations bookkeeping table, only the schema.
      - name: Apply migrations
        run: |
          set -euo pipefail
          for f in migrations/*.sql; do
            echo "==> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # mica-core's web_interop.rs is the yjs↔yrs cross-engine gate (CLAUDE.md
      # dependency exemption #7's load-bearing premise): it shells out to `node`
      # (preinstalled on GitHub-hosted runners) to run the COMMITTED web bundle
      # (clients/mica_flutter/web/yjs_bundle.js) headlessly against the yrs
      # side. No setup-node needed; on a bare self-hosted runner without node
      # the test fails loudly rather than skipping.
      - name: Test (incl. app-core + infra + api-server, Postgres-backed)
        run: cargo test -p mica-markdown -p mica-core -p mica-interchange -p mica-mcp-server -p mica-app-core -p mica-infra -p mica-api-server -p mica-cli

      # Separate invocation: `store` is a non-default feature, and features do
      # not apply across a multi-package `-p` list. Without this the 24 local
      # SQLite migration tests are not compiled, let alone run.
      - name: Test mica-core's gated SQLite store
        run: cargo test -p mica-core --features store

  mcp-conformance:
    # Drive `mica-cli mcp` with the OFFICIAL MCP client and fail on anything
    # it rejects. This exists because hand-rolled probes do not catch protocol
    # bugs: ours shipped a server that declared no `tools` capability and an
    # `outputSchema` of "AnyValue", and it looked perfectly healthy — the probe
    # called tools/list directly and never validated a thing, so every real
    # client registered ZERO tools while we believed it worked. A conforming
    # client is the only thing that reads what we actually declare.
    name: MCP (official inspector against mica-cli mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build mica-cli
        run: cargo build -p mica-cli
      # No live Mica needed: the handshake and tools/list are answered before
      # any REST call, which is exactly the surface that broke. A dummy PAT
      # keeps the credential chain satisfied without a server.
      - name: tools/list must survive a conforming client
        env:
          MICA_API_BASE_URL: https://mica.invalid
          MICA_PAT: dummy-not-used-for-handshake
        run: |
          set -euo pipefail
          # PINNED, and not to `@latest`. The inspector is a test harness, so
          # `@latest` means any upstream publish can turn main red with no commit
          # of ours involved - which is exactly what happened: 2.0.0 landed
          # 2026-07-28T07:33Z and every run after it failed with "no server"
          # (v2 stopped handing the parent env to the spawned server), across ten
          # unrelated commits, for nine hours. A permanently red check is worse
          # than no check: it is where a real failure goes unnoticed. Moving to
          # v2 is fine, but as a deliberate change with its arg/env contract
          # read, not as a surprise arriving on an unrelated commit.
          npx -y @modelcontextprotocol/inspector@1 --cli \
            ./target/debug/mica-cli mcp --method tools/list > tools.json
          python3 - <<'EOF'
          import json, sys
          tools = json.load(open("tools.json"))["tools"]
          assert tools, "the inspector returned no tools"
          for t in tools:
              # The two bugs that shipped, pinned on the wire the client reads.
              assert t["inputSchema"].get("type") == "object", t["name"]
              out = t.get("outputSchema")
              assert out is None or out.get("type") == "object", (
                  f"{t['name']}: outputSchema must be an object schema or absent; "
                  "one invalid entry makes a client discard the whole list")
          print(f"{len(tools)} tools accepted by the official client")
          EOF

  flutter:
    name: Flutter (analyze + Dart unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/mica_flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Warnings ARE fatal as of 2026-08-25. This comment used to say a separate
      # cleanup pass would address the pre-existing info/warning lints; what
      # actually happened is that an `invalid_return_type_for_catch_error`
      # warning sat unread until it shipped a defect — a `.catchError` handler
      # returning the wrong type, so the error path threw a TypeError instead of
      # failing quietly. There were exactly two warnings when that was found.
      # Both are gone, so the bar is met today; a raised bar that is already met
      # costs nothing, and it cannot be quietly re-lowered later.
      #
      # Infos stay non-fatal (~130, style-level). scripts/release-check.sh runs
      # this identically — that "identically" is load-bearing, see its comments.
      - run: flutter analyze --no-fatal-infos
      - name: Dart unit tests
        run: flutter test test
      # dart2js resolves the WEB variant of every conditional import; analyze
      # and `flutter test` resolve the IO one. So an IO/web stub drift (a member
      # added to local_offline_io.dart but not mirrored in local_offline_web.dart)
      # compiles clean everywhere EXCEPT the release web image — exactly what
      # silently broke the v0.12.0–v0.12.3 web images at tag time. Compile the
      # web bundle on every push so that class of drift fails pre-merge.
      # Same flags as the release build (justfile build-web / release.yml) so
      # this checks the artifact we actually ship.
      - name: Web compiles (dart2js resolves the web stubs)
        run: flutter build web --release --no-web-resources-cdn
      # CI tracks `channel: stable`, so its engine can be newer than the one the
      # committed web/gfonts mirror was generated from. The engine's fallback
      # shard URLs are version-pinned (notosanssc/v37/…) — if a Flutter bump
      # moves them, runtime font fallback would silently 404. Fail here instead.
      - name: gfonts mirror matches this engine's fallback tables
        run: bash tool/gfonts/mirror.sh --check

  # The web half of the product had ZERO end-to-end coverage. Not an oversight in
  # thoroughness: every one of the 14 integration tests in flutter-integration.yml
  # imports `frb_generated.dart` or `LocalOffline`, neither of which exists on web,
  # so none can be pointed at a browser. Meanwhile the web build is a categorically
  # different binary — yjs in JS instead of Rust yrs, IndexedDB instead of SQLite,
  # release-only so every `assert` is compiled out.
  #
  # Its own job, not a step in `flutter`: this one needs a database and a running
  # api, and a browser harness failing must not be reported as "analyze failed".
  web-e2e:
    name: Web e2e (browser against a real stack)
    runs-on: ubuntu-latest

    # Same block as the `rust` job above, for the same reason: the assertions are
    # about the real server folding real CRDT updates into real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mica
          POSTGRES_PASSWORD: mica
          POSTGRES_DB: mica
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mica"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://mica:mica@127.0.0.1:5432/mica
      # A seeded, already-verified account. The harness CANNOT register one:
      # registration is closed by default and, when open, answers 204 pending an
      # emailed confirmation — and a browser has no inbox. `MICA_SEED_TEST_USER`
      # exists for exactly this and is hard-ignored in production.
      E2E_EMAIL: e2e@mica.test
      E2E_PASSWORD: e2epassword123

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      # Same cache key as the `rust` job so this reuses that build rather than
      # compiling the workspace a second time.
      - uses: Swatinem/rust-cache@v2
        with:
          key: workspace

      # NO psql migration loop here, unlike the `rust` job — the api migrates itself
      # on startup and the two collide. That loop applies the schema WITHOUT writing
      # sqlx's `_sqlx_migrations` bookkeeping, so `run_migrations` then starts from
      # migration 1 and dies on `relation "users" already exists`. That is exactly
      # what this job did on its first real run.
      #
      # Letting the api do it is the better test anyway: it exercises the migration
      # path production takes, including the compile-time embedding that silently
      # omits a new file when `crates/infra/src/db.rs` was not touched.
      - name: Build the api
        run: cargo build -p mica-api-server

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Same flags as the release build. A bundle built differently from the one we
      # ship would make the CDN and caching assertions meaningless.
      - name: Build the web bundle
        working-directory: clients/mica_flutter
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn

      # nginx, not a plain static server: two of the assertions are ABOUT nginx —
      # that /verify-email, /reset-password and /s/ beat the SPA fallback, and that
      # the fixed-name entry files are not cacheable. A different server would test
      # a routing table nobody deploys. The dev config points at
      # host.docker.internal, which resolves on the runner via --add-host.
      - name: Serve the bundle through the real nginx config
        run: |
          set -euo pipefail
          # BEFORE nginx starts: flutter creates build/web mode 750 and the
          # container runs a different uid, so it would 403 on everything.
          chmod -R a+rX clients/mica_flutter/build/web
          # `/etc/nginx/nginx.conf`, NOT conf.d/default.conf — this file is a whole
          # nginx config (`worker_processes`, `events`, `http { … }`), not a snippet,
          # and dropping it into conf.d makes nginx refuse to start with
          # `"worker_processes" directive is not allowed here`. Same path
          # docker-compose.yml:111 uses; the mount has to match the file's shape.
          docker run -d --name mica-web-e2e \
            --add-host host.docker.internal:host-gateway \
            -p 8090:80 \
            -v "$PWD/deploy/nginx.dev.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/clients/mica_flutter/build/web:/usr/share/nginx/html:ro" \
            nginx:alpine
          # Fail here if the config is bad, rather than 60s later as "nginx cannot
          # reach the api" — a wrong diagnosis costs more than the wait.
          sleep 3
          docker exec mica-web-e2e nginx -t

      # Deliberately NO `set -e` in this step, and the polling is written out longhand.
      # The first version used `set -euo pipefail` with `curl … && break` inside the
      # loop, and a failing curl in a `&&` list took the whole script down: the wait
      # ran exactly one iteration, the nginx check then failed against an api that
      # had not started yet, and the api's own "ok" landed in the log one line AFTER
      # the error. A readiness wait that aborts on the first not-ready is not a wait.
      - name: Start the api
        run: |
          APP_ENV=test \
          HTTP_ADDR=0.0.0.0:8080 \
          JWT_SECRET=ci-only-not-a-secret \
          MICA_SEED_TEST_USER="${E2E_EMAIL}:${E2E_PASSWORD}" \
          MICA_APP_BASE_URL=http://127.0.0.1:8090 \
            ./target/debug/mica-api-server > /tmp/api.log 2>&1 &

          up=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              up="yes"; echo "api up after $((i * 2))s"; break
            fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "the api never became healthy"; exit 1
          fi

          # And the same through nginx. If the stack is unreachable the run must fail
          # HERE — otherwise the harness reports it as a convergence problem and
          # whoever reads the log goes hunting in the CRDT layer for a wiring fault.
          routed=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health > /dev/null 2>&1; then
              routed="yes"; echo "reachable through nginx after $((i * 2))s"; break
            fi
            sleep 2
          done
          if [ -z "$routed" ]; then
            echo "nginx cannot reach the api"; docker logs mica-web-e2e; exit 1
          fi

      - name: Web end-to-end assertions
        working-directory: e2e
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node web_e2e.mjs --base http://127.0.0.1:8090 \
                           --email "$E2E_EMAIL" --password "$E2E_PASSWORD"

      # The api's own log is the only place a server-side cause shows up; without
      # this a failure reads as "the browser did not see convergence" with no way
      # to tell whether the server ever accepted the push.
      - name: api log (on failure)
        if: failure()
        run: tail -100 /tmp/api.log

  # The api as a CONTAINER — the one shape nothing else here exercises.
  #
  # `rust` builds the binary on the runner. `web-e2e` proves nginx routes to an
  # api, but that api is a host process (see its /tmp/api.log). Neither touches
  # deploy/Dockerfile.api, so until now a broken image, or a container-only bug
  # like binding HTTP_ADDR to loopback (unreachable from outside the container),
  # first surfaced during a release — after the tag was already cut, because
  # release.yml is the only workflow that builds images and it runs `on: tags`.
  #
  # This replaces `just parity-check`, a manual and optional recipe that covered
  # exactly this and was therefore rarely run. A check nobody runs catches nothing.
  container:
    name: Container (api image + stack boots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Same action and cache scope shape as release.yml, so a warm layer cache
      # is shared and a repeat run is cheap. `load` puts the image in the local
      # daemon for compose to run; nothing is pushed.
      - name: Build the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.api
          load: true
          tags: willdockerhub/mica-api:ci-local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # nginx mounts this directory. A real Flutter bundle costs minutes and
      # proves nothing here — the routing half is already covered by web-e2e —
      # so a stub is enough to let nginx start and proxy /api.
      - name: Stub the web bundle
        run: mkdir -p deploy/web && echo 'ci stub' > deploy/web/index.html

      # The quickstart stack pulls published images; the from-source overlay swaps the
      # api for the one just built. --env-file carries committed throwaway values.
      # --wait blocks until every service with a healthcheck reports healthy, so
      # a stack that never comes up fails HERE, with compose naming the service,
      # instead of as an opaque timeout in the curl below. deploy/Dockerfile.api
      # carries the api's healthcheck, so this covers it.
      #
      # --renew-anon-volumes --force-recreate: start from a clean state instead
      # of inheriting whatever a previous run left behind.
      - name: Boot the stack
        run: |
          docker compose --project-directory . --env-file e2e/.env.ci \
            -f deploy/docker-compose.single.yml \
            -f e2e/docker-compose.from-source.yml \
            up -d --renew-anon-volumes --force-recreate --wait --wait-timeout 300

      # /api/ready, not /api/health: ready touches the database, so this asserts
      # the api reached postgres rather than merely that its process is alive.
      # NOT redundant with --wait above, and this is the whole point of the job.
      #
      # The image's healthcheck curls 127.0.0.1:8080 from INSIDE the container,
      # so an api bound to loopback — unreachable from anywhere else — passes it.
      # Only a request from OUT HERE, through the published port and nginx,
      # proves the stack is actually serving. That is the bug class this job
      # exists to catch, so the check has to live outside the container.
      #
      # /api/ready rather than /api/health: ready touches the database, so a pass
      # means the api reached postgres, not merely that its process is up.
      - name: Reach the stack from outside
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1/api/ready > /dev/null 2>&1; then
              echo "served from outside after $((i * 3))s"; exit 0
            fi
            sleep 3
          done
          echo "the stack reports healthy but is not reachable from outside"
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: |
          docker compose --project-directory . --env-file e2e/.env.ci \
            -f deploy/docker-compose.single.yml \
            -f e2e/docker-compose.from-source.yml logs --tail 120
