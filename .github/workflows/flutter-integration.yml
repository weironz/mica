name: Flutter Integration Tests

# Runs the Flutter Windows integration_test suite that CANNOT run in the plain
# `flutter test test` job (.github/workflows/ci.yml): every file here drives the
# real native FFI (flutter_rust_bridge / merman) and/or a real engine, so it
# needs a Windows desktop runner that builds + launches the actual app —
# exactly the gap ci.yml's header calls out as "deliberately NOT covered yet".
#
# Only the CLIENT-ONLY / OFFLINE files run here. Four files need the WHOLE dev
# stack up (postgres + rustfs + api-server, demo@mica.dev auto-registered) and
# are EXCLUDED — standing that up in plain CI is out of scope, and two of them
# race each other on a debug-connection collision (docs/dev-environment.md ~L137).
# Excluded, with why:
#   - cloud_sync_test.dart          needs a live server (http://127.0.0.1:8090)
#   - migration_sync_test.dart      needs the dev stack (api on :8080)
#   - offline_image_reconcile_test  needs the dev stack (api on :8080) + rustfs
#   - page_switch_fidelity_test     needs the dev stack (api on :8080)
# Better to run the offline set reliably than the full set flakily.
#
# The offline files are safe here: they either need no network, deliberately
# dial a dead socket, or stand up their OWN in-process fake WS server
# (cloud_sync_integrity / cloud_sync_converge use the real yrs FFI in-process).
#
# Files are run SERIALLY, one `flutter test` invocation each, with the app
# process killed between them. Each Windows integration run launches the real
# app, and the app is single-instance: a lingering instance makes the next
# launch fail with "Error waiting for a debug connection" — the race the docs
# warn about. Serial + kill-between makes that structurally impossible.

on:
  push:
    branches: [main]
    # A markdown-only commit cannot break a build. Two docs commits on 07-28
    # each started the full matrix; on the Windows integration workflow that is
    # 14 minutes of runner time for a paragraph.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

# Pushing several commits in a row (five within an hour on 07-28) left four
# superseded runs burning runners for a verdict nobody would read. The newest
# commit's result is the one that matters; a broken commit in the middle is
# still caught, because the fix is a later commit with its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: GitHub-hosted runners are OUTSIDE CN, so the storage.flutter-io.cn /
# pub.flutter-io.cn mirrors this repo sets LOCALLY must NOT be set here — the
# default Google endpoints are correct and fast on the runners.

jobs:
  integration:
    name: Flutter integration_test (Windows, offline set)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clients/mica_flutter
    steps:
      - uses: actions/checkout@v5

      # Same Flutter setup as release.yml's windows job.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The long pole is `flutter test -d windows` compiling the Rust FFI crate
      # (rust_lib_mica_flutter) via cargokit, same as `flutter build windows`.
      # rust-cache keeps the third-party deps (yrs, merman, ...) across runs.
      # The crate declares its own [workspace], so point at it directly — the
      # same key the release windows job avoids colliding with (different key).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/mica_flutter/rust
          key: mica-flutter-ffi-itest

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Run offline integration tests (serial, kill between)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # CLIENT-ONLY / offline files only. Keep in sync with the exclusion
          # list in this workflow's header when files are added or reclassified.
          $files = @(
            'integration_test/frb_document_test.dart',
            'integration_test/frb_editor_binding_test.dart',
            'integration_test/frb_roundtrip_test.dart',
            'integration_test/frb_store_test.dart',
            'integration_test/frb_sync_test.dart',
            'integration_test/frb_view_tree_test.dart',
            'integration_test/frb_zip_test.dart',
            'integration_test/vault_import_test.dart',
            'integration_test/cloud_offline_nav_test.dart',
            'integration_test/cloud_offline_read_test.dart',
            'integration_test/cloud_sync_converge_test.dart',
            'integration_test/cloud_sync_integrity_test.dart',
            'integration_test/gif_animation_test.dart',
            'integration_test/mermaid_render_test.dart'
          )
          $failed = @()
          foreach ($f in $files) {
            Write-Host "==> flutter test $f -d windows"
            flutter test $f -d windows
            if ($LASTEXITCODE -ne 0) { $failed += $f }
            # Kill any lingering app instance before the next file: the app is
            # single-instance, and a stray process makes the next launch fail
            # with the debug-connection race. Belt-and-suspenders on a fresh
            # runner, load-bearing when a test leaves the app up.
            Get-Process mica_flutter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::integration tests failed: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All offline integration tests passed"

  # The DESKTOP client against a REAL server. The offline set above proves the
  # FFI and the client's own logic; this proves the thing neither it nor the
  # Linux jobs in ci.yml can: a real Windows app talking WS + CRDT to a real
  # api-server over a real Postgres.
  #
  # Only `cloud_sync_test` of the four excluded files runs here — it is the one
  # that needs no OBJECT STORAGE. The other three (migration_sync,
  # offline_image_reconcile, page_switch_fidelity) upload real image bytes
  # through presign → PUT → complete, and a Windows runner cannot start the
  # rustfs Linux container (GitHub's Windows runners have no Linux service
  # containers). Standing up a Windows S3 binary for them is the path if it ever
  # matters; it is not worth it for three tests today.
  cloud:
    name: Flutter integration_test (Windows, live server)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mica-api-server-itest

      # windows-latest ships PostgreSQL but leaves it stopped, and there is no
      # `services:` block on Windows runners — that is the whole reason these
      # tests were excluded. Starting the preinstalled service is enough: the
      # api runs migrations itself at boot.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name postgresql* | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          $env:PGPASSWORD = 'root'
          $psql = (Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\psql.exe' | Select-Object -First 1).FullName
          & $psql -U postgres -c "CREATE USER mica WITH PASSWORD 'mica' SUPERUSER;"
          & $psql -U postgres -c "CREATE DATABASE mica OWNER mica;"
          Write-Host "postgres up: $($svc.Name)"

      - name: Build the api
        shell: pwsh
        env:
          DATABASE_URL: postgres://mica:mica@127.0.0.1:5432/mica
        run: cargo build -p mica-api-server

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/mica_flutter/rust
          key: mica-flutter-ffi-itest-cloud
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
        working-directory: clients/mica_flutter

      # Server and test in ONE step, deliberately.
      #
      # The first version started the api in its own step. The step reported
      # "api healthy on :8090" and the next step's test printed BOTH
      # "✅ two cloud sessions converge through the real server" AND
      # "skipping cloud_sync_test: no server at http://127.0.0.1:8090" — a green
      # job that had exercised nothing. The runner does not keep a step's child
      # process alive for the next step.
      #
      # The `skipping` guard below is the other half: this test degrades to a
      # skip when the server is absent and still exits 0, so a green here would
      # otherwise never prove the server was reachable.
      - name: cloud_sync_test against the live server
        shell: pwsh
        run: |
          $env:APP_ENV = 'development'
          $env:HTTP_ADDR = '127.0.0.1:8090'
          $env:DATABASE_URL = 'postgres://mica:mica@127.0.0.1:5432/mica'
          $env:JWT_SECRET = 'ci-integration-secret'
          $env:ACCESS_TOKEN_TTL_SECONDS = '86400'
          # cloud_sync_test registers its own throwaway account, and
          # registration is CLOSED by default (MICA_REGISTRATION_ENABLED).
          $env:MICA_REGISTRATION_ENABLED = 'true'
          $api = Start-Process -FilePath 'target\debug\mica-api-server.exe' `
            -RedirectStandardOutput api.log -RedirectStandardError api.err `
            -NoNewWindow -PassThru
          try {
            # Health-gate rather than sleep: the first boot also runs migrations
            # and the derived-column backfill.
            $ok = $false
            foreach ($i in 1..60) {
              try {
                Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8090/api/health -TimeoutSec 2 | Out-Null
                $ok = $true; break
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ok) {
              Write-Host "::error::api never became healthy"
              Get-Content api.log, api.err -ErrorAction SilentlyContinue | Select-Object -Last 60
              exit 1
            }
            Write-Host "api healthy on :8090"

            Push-Location clients/mica_flutter
            $out = flutter test integration_test/cloud_sync_test.dart -d windows `
              --dart-define=MICA_TEST_API=http://127.0.0.1:8090 2>&1 | Tee-Object -Variable lines
            $code = $LASTEXITCODE
            Pop-Location
            $out | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { exit $code }
            if ($lines -match 'skipping cloud_sync_test') {
              Write-Host "::error::the test SKIPPED (no server) and still exited 0 — the job proved nothing"
              exit 1
            }
            Write-Host "cloud_sync_test really ran against the live server"
          } finally {
            if ($api -and -not $api.HasExited) { Stop-Process -Id $api.Id -Force }
          }

      - name: api log (on failure)
        if: failure()
        shell: pwsh
        run: Get-Content api.log, api.err -ErrorAction SilentlyContinue | Select-Object -Last 120
