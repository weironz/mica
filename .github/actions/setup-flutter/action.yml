# The pinned Flutter SDK, as used by every workflow that builds or tests the
# app: the version comes from .fvmrc at the repo root (the single pin — see
# CLAUDE.md 开发机与工具链), stable channel, SDK download cached by the action.
#
# Extracted from six identical 4-line blocks (#88). Jobs that need rust-cache
# or a different working directory keep those in their own steps — this action
# only owns the SDK setup.
name: setup-flutter
description: Flutter SDK pinned by .fvmrc (stable channel, cached)
runs:
  using: composite
  steps:
    # Self-hosted runners keep the pinned SDK pre-installed under
    # RUNNER_TOOL_CACHE/flutter/<version>/<channel> (see docs/ops/ci-runners.md).
    - name: Reuse the pre-installed Flutter (self-hosted)
      id: preinstalled
      if: runner.environment == 'self-hosted' && env.MICA_SKIP_FLUTTER_SETUP != 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/reuse.sh"

    - uses: subosito/flutter-action@v2
      if: steps.preinstalled.outputs.ready != 'true'
      with:
        channel: stable
        flutter-version-file: .fvmrc
        cache: true
