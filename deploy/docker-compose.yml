# Production stack behind an EXISTING Traefik (label routing + Let's Encrypt),
# for multi-app servers — no host ports published; HTTPS everywhere.
#
#   .env.prod: DOMAIN, S3_DOMAIN, JWT_SECRET, POSTGRES_PASSWORD,
#              S3_ACCESS_KEY, S3_SECRET_KEY [, MICA_VERSION]
#
# DNS: both DOMAIN and S3_DOMAIN must point at this server. Presigned S3
# URLs embed https://S3_DOMAIN (SigV4 signs the Host header, which Traefik
# forwards unchanged).

# Bound every container's logs: json-file's default is unlimited, so one chatty
# service (or a crash loop) fills the disk and takes the whole node down. Cap at
# 3×10 MB per container and let the ring buffer drop the oldest — logs are a
# convenience here, not the record of truth. Applied to all services via anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-mica}
    volumes:
      - mica-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mica} -d ${POSTGRES_DB:-mica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.6
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    networks: [default, traefik]
    ports:
      - "9001:9001" # admin console (open the cloud security group to reach it)
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env.prod}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env.prod}
      RUSTFS_CORS_ALLOWED_ORIGINS: "https://${DOMAIN:?set in .env.prod}"
    volumes:
      - mica-prod-rustfs:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-network
      traefik.http.routers.mica-s3.rule: Host(`${S3_DOMAIN:?set in .env.prod}`)
      traefik.http.routers.mica-s3.entrypoints: websecure
      traefik.http.routers.mica-s3.tls: "true"
      traefik.http.routers.mica-s3.tls.certresolver: letsencrypt
      traefik.http.services.mica-s3.loadbalancer.server.port: "9000"

  # The three mica images are built + pushed together by CI on a `v*` tag
  # (.github/workflows/release.yml) and MUST move as a set —
  # MICA_VERSION keys all of them.
  #
  # MICA_REGISTRY defaults to Aliyun ACR: prod is in CN, and pulling from
  # Docker Hub there only worked through a third-party pull-through mirror
  # (docker.1ms.run) that caches tag->digest — a stale-image trap. ACR is
  # first-party; Docker Hub stays an off-site copy you can switch to with
  # MICA_REGISTRY=willdockerhub. Tags are immutable versions, never `latest`.
  api:
    image: ${MICA_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/mica-api:${MICA_VERSION:-v0.5.0}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Identify as production: enables the restrictive CORS default and
      # hard-ignores any MICA_SEED_TEST_USER. Without this the server defaults to
      # Development even in prod (config.rs `Environment`).
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-mica}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mica}
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod}
      S3_ENDPOINT: https://${S3_DOMAIN}
      S3_BUCKET: ${S3_BUCKET:-mica}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PRESIGN_TTL_SECONDS: "604800"
      # Public self-registration. Passed through EMPTY when the node's .env does
      # not set it, so the code's fail-safe default governs: config.rs opens the
      # gate only for an explicit true/1/yes/on, and an empty string matches none
      # of those, so unset here == CLOSED. Do NOT restore a `:-true` default: it
      # would override that fail-safe from the layer an operator is least likely
      # to read, and an instance that loses its .env line would silently reopen
      # to public signup. Set MICA_REGISTRATION_ENABLED=true in .env to open it.
      MICA_REGISTRATION_ENABLED: "${MICA_REGISTRATION_ENABLED:-}"
      # Per-workspace byte ceiling; unset = the code's 1 GiB default, `0` = no
      # limit. Named here because this block is an explicit ALLOW-LIST: a variable
      # in the node's .env that is not listed never reaches the process. Found by
      # smoke-testing 0.13.5 — the quota was set to 5000 on the node and an
      # over-limit upload was still accepted, because the setting went nowhere.
      MICA_WORKSPACE_QUOTA_BYTES: "${MICA_WORKSPACE_QUOTA_BYTES:-}"
      # The rest of what config.rs reads, passed through empty so "unset in .env"
      # means "use the code default". Listed even though nothing sets them today,
      # because the allow-list above is the trap: a knob that is not named here
      # DOES NOT EXIST in production, and the way that surfaces is an operator
      # setting it, restarting, and watching nothing change (0.13.5, the quota).
      # MICA_SEED_TEST_USER is deliberately absent — production must never be able
      # to seed an account, and config.rs hard-ignores it there anyway.
      #
      # MICA_WS_MIN_PROTOCOL is the WS version floor (`client_too_old` below it).
      # It ships inert at 0; raising it is a planned step, and until now that step
      # had nowhere to happen.
      MICA_WS_MIN_PROTOCOL: "${MICA_WS_MIN_PROTOCOL:-}"
      # Stream window + prune cadence (defaults 1000 / 64 / 32). Worth moving only
      # on a node whose documents are unusually large or unusually chatty.
      MICA_CATCH_UP_LIMIT: "${MICA_CATCH_UP_LIMIT:-}"
      MICA_STREAM_KEEP_MARGIN: "${MICA_STREAM_KEEP_MARGIN:-}"
      MICA_STREAM_PRUNE_EVERY: "${MICA_STREAM_PRUNE_EVERY:-}"
      # Cross-origin browser reads. Empty in production = deny all (the bundled
      # web app is same-origin with /api and needs no grant); comma-separated
      # origins opt in. This is the documented way to grant one — it just could
      # not be done from the node.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      # Token lifetimes (defaults 1h access / 30d refresh) and the PG pool size
      # (default 10).
      ACCESS_TOKEN_TTL_SECONDS: "${ACCESS_TOKEN_TTL_SECONDS:-}"
      REFRESH_TOKEN_TTL_SECONDS: "${REFRESH_TOKEN_TTL_SECONDS:-}"
      DATABASE_MAX_CONNECTIONS: "${DATABASE_MAX_CONNECTIONS:-}"
      # Public origin used to build the emailed password-reset link
      # ({base}/reset-password?token=…). Defaults to https://<DOMAIN>.
      MICA_APP_BASE_URL: "${MICA_APP_BASE_URL:-https://${DOMAIN}}"
      # Password-reset email delivery. Default "log" writes the reset link to the
      # server log and sends nothing (the flow still works — the operator reads
      # the link out of the logs). Set MICA_MAIL_BACKEND=directmail plus the vars
      # below in the node's .env to send via Aliyun DirectMail (邮件推送):
      #   MICA_MAIL_FROM            verified sender address (DirectMail AccountName)
      #   MICA_MAIL_FROM_NAME       optional display name
      #   MICA_MAIL_ACCESS_KEY_ID / _SECRET   a RAM AccessKey scoped to DirectMail
      #   MICA_MAIL_REGION          RegionId (default cn-hangzhou)
      MICA_MAIL_BACKEND: "${MICA_MAIL_BACKEND:-log}"
      MICA_MAIL_FROM: "${MICA_MAIL_FROM:-}"
      MICA_MAIL_FROM_NAME: "${MICA_MAIL_FROM_NAME:-}"
      MICA_MAIL_ACCESS_KEY_ID: "${MICA_MAIL_ACCESS_KEY_ID:-}"
      MICA_MAIL_ACCESS_KEY_SECRET: "${MICA_MAIL_ACCESS_KEY_SECRET:-}"
      MICA_MAIL_REGION: "${MICA_MAIL_REGION:-cn-hangzhou}"
      MICA_MAIL_ENDPOINT: "${MICA_MAIL_ENDPOINT:-}"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  web:
    image: ${MICA_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/mica-web:${MICA_VERSION:-v0.5.0}
    restart: unless-stopped
    logging: *default-logging
    networks: [default, traefik]
    depends_on:
      - api
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-network
      traefik.http.routers.mica.rule: Host(`${DOMAIN}`)
      traefik.http.routers.mica.entrypoints: websecure
      traefik.http.routers.mica.tls: "true"
      traefik.http.routers.mica.tls.certresolver: letsencrypt
      traefik.http.services.mica.loadbalancer.server.port: "80"

  # Encrypted, deduplicated, incremental backup of every workspace (Markdown +
  # images) to Aliyun OSS, via mica-cli's built-in restic-format engine. Opt-in:
  # it only starts under the `backup` profile, once .env has a read-scoped token
  # and the repo/OSS creds:
  #   docker compose --profile backup up -d backup
  # Talks to the API over the internal network (no token ever leaves the host).
  backup:
    image: ${MICA_REGISTRY:-registry.cn-shenzhen.aliyuncs.com/willspace}/mica-cli:${MICA_VERSION:-v0.5.0}
    profiles: ["backup"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      MICA_SERVER: http://api:8080
      MICA_TOKEN: ${MICA_BACKUP_TOKEN:-}            # a read-scoped Mica token
      # rustic repo encryption password — SAVE OFF-HOST (lose it, lose the repo).
      RUSTIC_PASSWORD: ${MICA_BACKUP_PASSWORD:-}
      # pg_dump connection string for the off-site DB snapshot (full-instance DR:
      # users/memberships/CRDT history the content export does NOT capture). The
      # backup container shares the default network with postgres, so point it at
      # the internal host, e.g. in .env:
      #   MICA_BACKUP_PGURL=postgres://mica:<POSTGRES_PASSWORD>@postgres:5432/mica
      # Unset → the database leg is SKIPPED, and `mica-cli backup` then fails
      # the run rather than exiting 0 on a content-only backup.
      MICA_BACKUP_PGURL: ${MICA_BACKUP_PGURL:-}
      # Dead man's switch: `mica-cli backup daemon` pings this on success and
      # <URL>/fail on a failed run. Unset → no ping. e.g. a healthchecks.io URL.
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      # opendal S3 backend → Aliyun OSS. mica-cli renders these into
      # /etc/rustic/rustic.toml (virtual-host style is forced on, required for
      # OSS). Each value stands alone so the AccessKey rotates without touching
      # the rest; use a fresh OSS_ROOT prefix to share a bucket with another repo.
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_SECRET_ACCESS_KEY: ${OSS_SECRET_ACCESS_KEY:-}
      OSS_ROOT: ${OSS_ROOT:-mica}
      # ── Blob leg: RustFS S3 → OSS, mirrored by rclone, NOT through rustic
      # (crates/cli/src/backup.rs explains why immutable blobs want a mirror, not
      # snapshots). Any of these unset → that leg is skipped with a WARN and
      # images stay covered only indirectly, via the content export.
      # This block is an explicit ALLOW-LIST: a variable set in the node's .env
      # but missing HERE never reaches the process — that is exactly how the
      # workspace quota shipped unadjustable in 0.13.5.
      RUSTFS_S3_ACCESS_KEY_ID: ${RUSTFS_S3_ACCESS_KEY_ID:-}
      RUSTFS_S3_SECRET_ACCESS_KEY: ${RUSTFS_S3_SECRET_ACCESS_KEY:-}
      RUSTFS_S3_ENDPOINT: ${RUSTFS_S3_ENDPOINT:-http://rustfs:9000}
      RUSTFS_S3_BUCKET: ${RUSTFS_S3_BUCKET:-mica}
      # Destination prefix in OSS. Kept under its own root so plain objects
      # never mix with the rustic repo's internals.
      OSS_BLOB_BUCKET: ${OSS_BLOB_BUCKET:-}
      OSS_BLOB_ROOT: ${OSS_BLOB_ROOT:-mica-blobs}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-6}
    volumes:
      - mica-prod-backup:/var/lib/mica/export

  # Mica's own scraper. Config shared with the dev stack (deploy/prometheus.yml)
  # so the two cannot drift.
  #
  # NOT on the traefik network, and the port binds to LOOPBACK only: a metrics
  # UI on the public internet is a free map of the system, and the endpoint it
  # scrapes is private for the same reason (crates/api-server/src/metrics.rs).
  # To look at it, tunnel:
  #   ssh -N -L 9090:127.0.0.1:9090 root@mica.cloudcele.com
  #
  # Why its own scraper rather than the VictoriaMetrics already running on this
  # box: that one belongs to the neostor stack. Sharing it would couple Mica's
  # ability to see itself to a system Mica has no say over — its retention, its
  # upgrades, its outages.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # /data on this box was at 83% on 2026-08-04, so retention is the knob
      # that decides whether this helps or becomes the next incident. Both
      # limits apply — whichever is hit first wins.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mica-prod-prometheus:/prometheus

networks:
  traefik:
    external: true
    name: traefik-network

volumes:
  mica-prod-postgres:
  mica-prod-rustfs:
  mica-prod-backup:
  mica-prod-prometheus:
