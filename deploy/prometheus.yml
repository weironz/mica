# Mica's own scraper. Deliberately small.
#
# The box already runs someone else's VictoriaMetrics + Grafana (the neostor
# stack). We do NOT scrape from it: sharing a monitoring stack couples Mica's
# ability to see itself to a system it has no say over — its retention, its
# upgrades, its outages. One more container is a cheaper price than that
# coupling.
#
# One target on purpose. Node-level metrics (CPU, disk, memory) would need
# node_exporter, and blackbox probing ("is it up from outside") has to run
# somewhere that is NOT this box — both are separate decisions, not things to
# smuggle in under "add monitoring". What this file covers is the one gap
# 2026-08-03 actually exposed: the application's own latency and DB-pool
# pressure, which no liveness check can express.
global:
  # 15s is Prometheus's default and it is the right default here: the incident
  # this exists for developed over minutes, so a shorter interval would buy
  # noise plus disk and nothing else.
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    stack: mica

scrape_configs:
  - job_name: mica-api
    # Container name on the compose network — not a public hostname. `/metrics`
    # is not routed through nginx, so this is the only way in, which is also
    # what keeps it private (see crates/api-server/src/metrics.rs).
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  # Prometheus scraping itself. Two lines, and it is how you tell "the app is
  # quiet" apart from "the scraper died" — the failure mode that made the old
  # GitHub-Actions probe worthless was precisely that nothing watched the
  # watcher.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
