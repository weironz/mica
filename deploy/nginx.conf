worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm;

  # The DEFAULT body cap for everything, including the public endpoints.
  #
  # This used to be `1g`, set at `http` scope for the ZIP-import route — so every
  # unauthenticated path inherited it too (sign-in, password reset, verification,
  # the public blob links). Nginx buffers the whole request body before the app
  # ever sees it (`proxy_request_buffering` defaults on), so a 1 GiB allowance at
  # this layer is up to 1 GiB of buffering to disk or memory per connection,
  # decided BEFORE the application's own 2/8 MiB limits get a say. Nothing on
  # these paths legitimately sends more than a few kilobytes.
  #
  # 1 MiB is generous for a login form, a JSON write, or a settings blob, and it
  # keeps the anonymous surface cheap. The import route raises it back to 1g on
  # its own path below — a bigger allowance belongs to ONE route, not to the
  # whole server.
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 80;
    server_name _;

    # Flutter web bundle (static).
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Never cache Flutter's entry files. These have FIXED names (not
    # content-hashed) — index.html loads flutter_bootstrap.js loads main.dart.js
    # — so without no-cache a deploy is invisible until every returning user
    # hard-refreshes. (main.dart.js was missing here, which is exactly how
    # v0.5.2's inline math looked "not deployed" on cached browsers.) Etag still
    # lets an unchanged file 304, so this costs a revalidation round-trip, not a
    # re-download. Content-hashed assets (canvaskit/, fonts) stay cacheable.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }
    location = /flutter_bootstrap.js {
      add_header Cache-Control "no-cache";
    }
    location = /main.dart.js {
      add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
      add_header Cache-Control "no-cache";
    }

    # Public share pages (/s/{token}) → backend. Must precede the SPA fallback,
    # or `try_files` would serve index.html instead of the server-rendered page.
    location /s/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Password-reset page (/reset-password, GET form + POST) → backend. Server-
    # rendered like /s/, so it must also precede the SPA fallback. Exact match:
    # nothing else hangs off this path.
    location = /reset-password {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Email-confirmation page (/verify-email?token=…) → backend. Same reasoning as
    # /reset-password above: server-rendered, must precede the SPA fallback, exact
    # match. Without this block the emailed link lands on index.html and the user
    # sees the app instead of a confirmation — with the token already spent.
    # The legal pages. Exact-match and proxied ahead of the SPA fallback: without
    # these, `try_files` answers /privacy with index.html and the policy silently
    # becomes the app.
    location = /privacy {
      proxy_pass http://api:8080;
    }

    location = /terms {
      proxy_pass http://api:8080;
    }

    location = /verify-email {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Workspace ZIP import → backend, and the ONE route allowed a huge body.
    #
    # An exact match (`=`) on the file-upload path only. It must stay exact: a
    # prefix match here would re-open the anonymous surface this file just
    # closed, because everything under `/api/workspaces/` would inherit it —
    # including the endpoints that need no token.
    #
    # The path must stay in step with `routes/mod.rs` (the route that sets the
    # same 1 GiB in `DefaultBodyLimit`). Nginx rejects the oversized body before
    # the app sees it, so a mismatch here is what a "ZIP import silently fails on
    # big archives" bug looks like.
    location = /api/workspaces/import {
      client_max_body_size 1g;
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # Do NOT buffer the import body on disk first: it is a stream the app
      # already reads into a temp file, and double-buffering a 1 GiB archive
      # costs the disk twice over. The size cap above still applies.
      proxy_request_buffering off;
    }

    # REST API → backend.
    location /api/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # WebSocket rooms (realtime collaboration) → backend, with upgrade.
    location /ws/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
