# QUICKSTART: one server, reached by IP, no reverse proxy to set up.
#
#   cp deploy/.env.prod.example .env.prod   # then edit (SERVER_IP, MICA_VERSION)
#   docker compose --env-file .env.prod -f deploy/docker-compose.single.yml up -d
#
# Then open http://<SERVER_IP>/. Migrations are embedded in the API binary and
# run at startup, so there is no separate migrate step.
#
# NOTHING IS BUILT HERE — every image is pulled. This used to build the API from
# source and stage a Flutter bundle into ./deploy/web with a shell script, which
# meant a machine needed the Rust and Flutter toolchains just to run a notes app,
# and the build path silently drifted from the real one because nobody ran it.
# The published `mica-web` image already carries nginx, its config and the
# bundle; `mica-api` is the same binary the maintainer's own server runs.
#
# The only difference from deploy/docker-compose.yml (that server's stack) is the
# front door: it publishes no host ports and is routed by an existing Traefik
# with TLS, this one publishes :80 directly. Same images, same versions.
#
# Public ports: 80 (app) and 9000 (S3 — browsers presign against it directly).
# HTTP, not HTTPS: no one can issue a certificate for a bare IP. Put this behind
# a reverse proxy with a real hostname before it carries anything you would mind
# being read off the wire.

# Bound every container's logs: json-file defaults to unlimited, so one chatty
# service (or a crash loop) can fill the disk and take the node down. Cap at
# 3×10 MB per container; the ring buffer drops the oldest.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # MAJOR VERSION IS PART OF THE DATA DIRECTORY. Postgres refuses to start on
    # a data dir written by a different major ("database files are incompatible
    # with server") and crash-loops — bumping 16→18 here without the dump/restore
    # in docs/upgrade-infra.md takes the stack down and NOTHING repairs it
    # automatically. That runbook is the only supported way to move this number.
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mica}
      # Defaulted, and safe to default: this service publishes no port, so the
      # database is reachable only from the other containers on this stack's
      # network. Override it in .env.prod if you expose the database at all.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mica}
      POSTGRES_DB: ${POSTGRES_DB:-mica}
    volumes:
      # PG18+ 的官方镜像换了数据目录约定:数据落在 /var/lib/postgresql/<major>/docker,
      # 挂载点必须是 /var/lib/postgresql 这一层。仍挂 .../data 的话容器直接报
      # "in 18+, these Docker images are configured to store database data in a
      # format which is compatible with pg_ctlcluster" 然后 crash-loop。
      # (2026-08-28 升级当天在真机上撞到 —— 本地彩排用的是不带卷挂载的 docker run,
      #  覆盖不到这一条。见 docs/upgrade-infra.md。)
      - mica-prod-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mica} -d ${POSTGRES_DB:-mica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "9000:9000" # S3 API — public: browsers use presigned URLs directly
      # Admin console. Published on purpose, but know what it is: a browser UI
      # that can browse, download and DELETE the bucket, and it authenticates
      # with S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY. Left at their defaults, those are
      # published in this repository — so on a node strangers can reach, this
      # port hands them the file manager, not just the files. Set both keys
      # (see .env.prod.example) or drop this line on anything public.
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # Serves the console on :9001 (published above). Flip to "false" to close
      # it without touching the ports.
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-true}"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      # DEFAULTED — and unlike the postgres password, this one IS internet-facing:
      # the ports above publish :9000 so browsers can presign against it directly.
      # A default therefore means every install that leaves it alone shares one
      # key, and that key is published in this repository. That is a deliberate
      # trade for a one-command quickstart, NOT a safe default: change both on
      # any instance whose :9000 is reachable by people you do not trust.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-mica}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-mica-default-not-a-secret}
      # Browsers presign-PUT/GET directly against :9000 from the app origin.
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://${SERVER_IP:?set in .env.prod}"
    volumes:
      - mica-prod-rustfs:/data

  # MICA_VERSION has no default on purpose: a quickstart that silently installs
  # whatever version happened to be pinned here months ago is worse than one that
  # asks. Pick a tag from https://github.com/weironz/mica/releases.
  #
  # MICA_REGISTRY defaults to Docker Hub, which is the reachable one from most of
  # the world. The maintainer's own stack defaults to Aliyun ACR instead, because
  # it runs in CN where Docker Hub is not dependable.
  api:
    image: ${MICA_REGISTRY:-willdockerhub}/mica-api:${MICA_VERSION:?set MICA_VERSION in .env.prod — pick one from https://github.com/weironz/mica/releases}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Identify as production: enables the restrictive CORS default and
      # hard-ignores any MICA_SEED_TEST_USER. Without this the server defaults to
      # Development even in prod (config.rs `Environment`).
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-mica}:${POSTGRES_PASSWORD:-mica}@postgres:5432/${POSTGRES_DB:-mica}
      # NOT `:?` any more: blank is legitimate. The server mints its own signing
      # key on first boot and keeps it in `server_secrets` — refusing to start on
      # a blank value here would make that unreachable. A value the operator DOES
      # supply is still validated strictly by the api itself.
      JWT_SECRET: ${JWT_SECRET:-}
      # Must be BROWSER-reachable — presigned URLs embed this host.
      #
      # S3_INTERNAL_ENDPOINT is the address THIS CONTAINER uses for the same
      # store, and it is a different question: the public one may route out
      # through NAT and back, or not resolve in here at all, while the store is
      # one hop away on this network. Server-side callers (bucket provisioning,
      # blob GC) use it; browsers never see it. Without it those two fail while
      # every browser upload keeps working — a failure with no visible symptom.
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_ENDPOINT: http://${SERVER_IP}:9000
      S3_BUCKET: ${S3_BUCKET:-mica}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mica}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-mica-default-not-a-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PRESIGN_TTL_SECONDS: "604800"
      # Per-FILE ceiling; empty = the code's 25 MiB default. Named because this
      # block is an explicit ALLOW-LIST — a variable in .env that is not listed
      # never reaches the process, and the way that surfaces is an operator
      # setting it, restarting, and watching nothing change.
      S3_MAX_UPLOAD_BYTES: "${S3_MAX_UPLOAD_BYTES:-}"
      # S3_PUBLIC_BASE_URL stays UNSET: the bucket is private, GETs are signed.
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started

  # Self-contained: the image is nginx plus deploy/nginx.conf plus the built
  # Flutter bundle (see deploy/Dockerfile.web). It serves the app AND proxies
  # /api and /ws to api:8080 — which is why this stack needs no Traefik and no
  # mounted config. Nothing here reads the repo, so the compose file is the only
  # file you need on the server.
  web:
    image: ${MICA_REGISTRY:-willdockerhub}/mica-web:${MICA_VERSION:?set MICA_VERSION in .env.prod — pick one from https://github.com/weironz/mica/releases}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mica-prod-postgres:
  mica-prod-rustfs:
