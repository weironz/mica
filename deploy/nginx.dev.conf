# Dev web server: same routing as production nginx, but /api and /ws proxy
# to the HOST-run api (fast `cargo run` cycle stays outside docker).
worker_processes 1;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # Observation only: do not enforce this policy before a deployment cycle.
  # Hashes cover index.html's three fixed bootstrap scripts. Flutter injects
  # runtime CSS, so style-src retains unsafe-inline; script-src does not.
  # HTTPS/WSS allows configured API servers and presigned object-store URLs.
  # Proxied HTML (especially /s/) keeps its own enforced SAFE_HTML_CSP.
  map $uri $mica_app_csp_report_only {
    ~^/(api|ws|s)(/|$) "";
    ~^/(reset-password|verify-email|privacy|terms)$ "";
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval' 'sha256-jD4jPnH2k35tCJtxmWq8jDR74RGERxVRCCehffyCsVY=' 'sha256-mWsdS8F66uEgns14leFU7UJW+6QfmYJ2VhcqDJ3/cS0=' 'sha256-mehzfusp6iUuXVWBWXGZ6yMTCXLujNdKazR9JKrxMOc='; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https: http:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https: wss: http: ws:; form-action 'self'";
  }

  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/wasm font/otf font/ttf;
  client_max_body_size 1g;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;


    # Dev: never cache ANYTHING. Stale main.dart.js after a rebuild cost us
    # hours of debugging phantom bugs against old code — fresh beats fast on
    # a bind-mounted dev bundle. (Production keeps long-lived caching.)
    # Older nginx images omit OTF/TTF types. WOFF2 is already compressed.
    location ~* \.(otf|ttf|woff2)$ {
      types {
        font/otf otf;
        font/ttf ttf;
        font/woff2 woff2;
      }
      try_files $uri =404;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;
      add_header Cache-Control "no-store";
    }

    # Dart2JS deferred chunks have fixed names too. Missing chunks must be
    # 404s rather than the SPA fallback, and deployment updates revalidate.
    location ~ /main\.dart\.js_[^/]+\.part\.js$ {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    location / {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;
      add_header Cache-Control "no-store";
      try_files $uri $uri/ /index.html;
    }

    # Match the production engine/retired-entry routing, including missing files.
    location /mica_md/ {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;
      add_header Cache-Control "no-cache";
    }
    location /mica_doc/ {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;
      add_header Cache-Control "no-cache";
    }
    location /mica_preview/ {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;
      add_header Cache-Control "no-cache";
    }
    location = /mica_preview_worker.js {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only $mica_app_csp_report_only always;
      add_header Cache-Control "no-cache";
    }
    location = /mermaid.min.js {
      return 404;
    }
    location = /yjs_bundle.js {
      return 404;
    }

    location /api/ {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
    # Server-rendered password-reset page → host api (exact match beats the SPA
    # fallback regardless of block order).
    location = /reset-password {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
    # The legal pages. Exact-match and proxied ahead of the SPA fallback: without
    # these, `try_files` answers /privacy with index.html and the policy silently
    # becomes the app.
    #
    # `host.docker.internal`, NOT `api` — that is the PRODUCTION compose service
    # name, and this file's api runs on the host. Writing `api` here made nginx
    # fail to resolve the upstream at startup, so the container exited instantly
    # and CI's `nginx -t` reported only "container is not running".
    location = /privacy {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location = /terms {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Same, for the email-confirmation page.
    location = /verify-email {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
    # Public share pages. Present in the production config since the feature
    # shipped, and MISSING here until 2026-07-30 — so `/s/<token>` fell through to
    # the SPA and the share page could not be exercised against the dev stack at
    # all. A dev/prod routing divergence is exactly what makes "works locally" say
    # nothing about the thing users actually hit.
    location /s/ {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
    location /ws/ {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }
  }
}
